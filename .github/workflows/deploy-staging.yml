name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Immutable Docker Hub digest published from a develop commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-operations
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: crabitteam2/crabit-backend

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    env:
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      PUBLIC_HOST: ${{ vars.CRABIT_PUBLIC_HOST }}
      DATABASE_NAME: ${{ vars.CRABIT_DATABASE_NAME }}
      DATABASE_USERNAME: ${{ vars.CRABIT_DATABASE_USERNAME }}
      COMPOSE_PROJECT: ${{ vars.CRABIT_COMPOSE_PROJECT }}
      DATABASE_PASSWORD: ${{ secrets.CRABIT_DATABASE_PASSWORD }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Prove the digest belongs to the develop lane
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >/dev/null
          revision="$(docker image inspect "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          [[ "${revision}" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin develop
          git merge-base --is-ancestor "${revision}" origin/develop \
            || { echo 'selected digest is not attributable to develop' >&2; exit 1; }
      - name: Deploy selected Staging digest
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${DEPLOY_HOST}" =~ ^[A-Za-z0-9.-]+$ && "${DEPLOY_PORT}" =~ ^[0-9]{1,5}$ && "${DEPLOY_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "${PUBLIC_HOST}" =~ ^[A-Za-z0-9.-]+$ && "${DATABASE_NAME}" =~ ^[A-Za-z0-9_]+$ && "${DATABASE_USERNAME}" =~ ^[A-Za-z0-9_]+$ && "${COMPOSE_PROJECT}" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "${DATABASE_PASSWORD}" =~ ^[A-Za-z0-9_-]{16,}$ ]] || { echo 'database password must be base64url-safe' >&2; exit 1; }
          umask 077
          key_file="${RUNNER_TEMP}/deploy-key"
          known_hosts="${RUNNER_TEMP}/known-hosts"
          runtime_env="${RUNNER_TEMP}/runtime.env"
          archive="${RUNNER_TEMP}/deployment.tgz"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${key_file}"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${known_hosts}"
          {
            printf 'CRABIT_ENV=staging\nCRABIT_COMPOSE_PROJECT=%s\nCRABIT_SPRING_PROFILE=e2e\n' "${COMPOSE_PROJECT}"
            printf 'CRABIT_PUBLIC_HOST=%s\nCRABIT_DATABASE_NAME=%s\nCRABIT_DATABASE_USERNAME=%s\n' "${PUBLIC_HOST}" "${DATABASE_NAME}" "${DATABASE_USERNAME}"
            printf 'CRABIT_DATABASE_PASSWORD=%s\n' "${DATABASE_PASSWORD}"
          } > "${runtime_env}"
          tar -czf "${archive}" deploy scripts/deployment
          ssh_opts=(-p "${DEPLOY_PORT}" -i "${key_file}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${known_hosts}")
          scp_opts=(-P "${DEPLOY_PORT}" -i "${key_file}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${known_hosts}")
          release=".local/share/crabit/releases/${GITHUB_SHA}"
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${release}'"
          scp "${scp_opts[@]}" "${archive}" "${runtime_env}" "${DEPLOY_USER}@${DEPLOY_HOST}:${release}/"
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" "chmod 600 '${release}/runtime.env' && tar -xzf '${release}/deployment.tgz' -C '${release}' && chmod 700 '${release}/scripts/deployment/'*.sh && CRABIT_RUNTIME_ENV='${release}/runtime.env' '${release}/scripts/deployment/deploy.sh' '${IMAGE_DIGEST}' e2e"
