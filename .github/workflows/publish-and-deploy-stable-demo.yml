name: Publish Backend and Deploy Stable Demo

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: backend-publication-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: crabitteam2/crabit-backend
  RECAP_IMAGE_REPOSITORY: crabitteam2/crabit-data

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: dockerhub
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the real recap service
        uses: actions/checkout@v4
        with:
          repository: crabitteam2/crabit-data
          ref: main
          path: .runtime/crabit-data
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify source and image
        run: |
          ./gradlew test --tests 'com.crabit.backend.recap.*' --tests 'com.crabit.backend.deployment.*' --console=plain
          ./gradlew test --console=plain
          image="crabit-backend:sha-${GITHUB_SHA:0:12}"
          recap_revision="$(git -C .runtime/crabit-data rev-parse HEAD)"
          recap_image="crabit-recap:sha-${recap_revision:0:12}"
          docker build --provenance=false --metadata-file "${RUNNER_TEMP}/tested-image-metadata.json" \
            --build-arg "VCS_REF=${GITHUB_SHA}" --tag "${image}" .
          docker build --provenance=false --build-arg "VCS_REF=${recap_revision}" \
            --tag "${recap_image}" .runtime/crabit-data
          jq -e '.["containerimage.digest"] | test("^sha256:[0-9a-f]{64}$")' \
            "${RUNNER_TEMP}/tested-image-metadata.json" >/dev/null
          jq -e '.["containerimage.config.digest"] | test("^sha256:[0-9a-f]{64}$")' \
            "${RUNNER_TEMP}/tested-image-metadata.json" >/dev/null
          ./scripts/deployment/verify-image.sh "${image}" "${GITHUB_SHA}"
          ./scripts/deployment/verify-runtime.sh "${image}" "${recap_image}"
          ./scripts/deployment/verify-workflows.sh
          git diff --check
      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish or adopt immutable commit tag
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="sha-${GITHUB_SHA:0:12}"
          local_image="crabit-backend:${tag}"
          image="${IMAGE_REPOSITORY}:${tag}"
          metadata="${RUNNER_TEMP}/tested-image-metadata.json"
          local_manifest_digest="$(jq -r '.["containerimage.digest"] // empty' "${metadata}")"
          local_config_digest="$(jq -r '.["containerimage.config.digest"] // empty' "${metadata}")"
          [[ "${local_manifest_digest}" =~ ^sha256:[0-9a-f]{64}$ \
            && "${local_config_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'local tested image identity is invalid' >&2
            exit 1
          }
          extract_digest() {
            local output="$1"
            local resolved
            resolved="$(printf '%s\n' "${output}" | sed -nE 's/.*[Dd]igest: (sha256:[0-9a-f]{64})([[:space:]].*)?$/\1/p')"
            [[ "${resolved}" =~ ^sha256:[0-9a-f]{64}$ && "${resolved}" != *$'\n'* ]] || {
              echo 'registry digest read-back failed' >&2
              return 1
            }
            printf '%s\n' "${resolved}"
          }
          if pull_output="$(docker pull "${image}" 2>&1)"; then
            digest="$(extract_digest "${pull_output}")"
          elif printf '%s\n' "${pull_output}" | grep -Eiq 'manifest unknown|manifest for [^[:space:]]+ not found'; then
            docker tag "${local_image}" "${image}"
            push_output="$(docker push "${image}")"
            digest="$(extract_digest "${push_output}")"
            docker pull "${IMAGE_REPOSITORY}@${digest}" >/dev/null
          else
            printf '%s\n' "${pull_output}" >&2
            echo 'registry tag lookup failed; refusing to publish' >&2
            exit 1
          fi
          manifest="$(docker manifest inspect "${IMAGE_REPOSITORY}@${digest}")"
          media_type="$(jq -r '.mediaType // empty' <<< "${manifest}")"
          case "${media_type}" in
            application/vnd.docker.distribution.manifest.v2+json|application/vnd.oci.image.manifest.v1+json) ;;
            *) echo 'published digest is not a single-platform image manifest' >&2; exit 1 ;;
          esac
          config_digest="$(jq -r '.config.digest // empty' <<< "${manifest}")"
          [[ "${config_digest}" == "${local_config_digest}" ]] || {
            echo 'published image does not match the locally tested image' >&2
            exit 1
          }
          echo "image_digest=${digest}" >> "${GITHUB_OUTPUT}"

  deploy-stable-demo:
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: stable-demo
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: stable-demo-operations
      cancel-in-progress: false
    env:
      IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
      RECAP_IMAGE_DIGEST: ${{ vars.CRABIT_RECAP_IMAGE_DIGEST }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      CRABIT_PUBLIC_HOST: ${{ vars.CRABIT_PUBLIC_HOST }}
      CRABIT_WISH_PHOTO_ENABLED: ${{ vars.CRABIT_WISH_PHOTO_ENABLED || 'false' }}
      CRABIT_DATABASE_NAME: ${{ vars.CRABIT_DATABASE_NAME }}
      CRABIT_DATABASE_USERNAME: ${{ vars.CRABIT_DATABASE_USERNAME }}
      CRABIT_COMPOSE_PROJECT: ${{ vars.CRABIT_COMPOSE_PROJECT }}
      CRABIT_DATABASE_PASSWORD: ${{ secrets.CRABIT_DATABASE_PASSWORD }}
      CRABIT_RECAP_GENERATION_CREDENTIAL: ${{ secrets.CRABIT_RECAP_GENERATION_CREDENTIAL }}
      CRABIT_DEMO_TOKEN_OWNER: ${{ secrets.CRABIT_DEMO_TOKEN_OWNER }}
      CRABIT_DEMO_TOKEN_FRIEND: ${{ secrets.CRABIT_DEMO_TOKEN_FRIEND }}
      CRABIT_DEMO_TOKEN_NONFRIEND: ${{ secrets.CRABIT_DEMO_TOKEN_NONFRIEND }}
      CRABIT_DEMO_TOKEN_BLOCKED: ${{ secrets.CRABIT_DEMO_TOKEN_BLOCKED }}
      CRABIT_DEMO_TOKEN_OTHER_ACADEMY: ${{ secrets.CRABIT_DEMO_TOKEN_OTHER_ACADEMY }}
      CRABIT_DEMO_TOKEN_STAFF: ${{ secrets.CRABIT_DEMO_TOKEN_STAFF }}
      CRABIT_DEMO_BALANCE_PROVIDER_URL: ${{ vars.CRABIT_DEMO_BALANCE_PROVIDER_URL }}
      CRABIT_DEMO_BALANCE_PROVIDER_TOKEN: ${{ secrets.CRABIT_DEMO_BALANCE_PROVIDER_TOKEN }}
      CRABIT_GCP_KNOWN_HOSTS_CONTENT: ${{ secrets.CRABIT_GCP_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v7
      - name: Check out the recap source lane
        uses: actions/checkout@v4
        with:
          repository: crabitteam2/crabit-data
          ref: main
          path: .runtime/crabit-data
          fetch-depth: 0
      - name: Authenticate with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 500.0.0"
      - name: Deploy the just-published main digest
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${RECAP_IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ -n "${CRABIT_RECAP_GENERATION_CREDENTIAL}" \
            && "${CRABIT_RECAP_GENERATION_CREDENTIAL}" =~ ^[A-Za-z0-9._:/@+-]+$ ]]
          docker pull "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >/dev/null
          docker pull "${RECAP_IMAGE_REPOSITORY}@${RECAP_IMAGE_DIGEST}" >/dev/null
          recap_revision="$(docker image inspect "${RECAP_IMAGE_REPOSITORY}@${RECAP_IMAGE_DIGEST}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          [[ "${recap_revision}" =~ ^[0-9a-f]{40}$ ]]
          git -C .runtime/crabit-data merge-base --is-ancestor "${recap_revision}" HEAD \
            || { echo 'selected recap digest is not attributable to crabit-data main' >&2; exit 1; }
          ./scripts/deployment/verify-runtime.sh \
            "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" \
            "${RECAP_IMAGE_REPOSITORY}@${RECAP_IMAGE_DIGEST}"
          umask 077
          known_hosts="${RUNNER_TEMP}/known-hosts"
          runtime_env="${RUNNER_TEMP}/runtime.env"
          snapshot_proof="${RUNNER_TEMP}/snapshot-proof.env"
          archive="${RUNNER_TEMP}/deployment.tgz"
          printf '%s\n' "${CRABIT_GCP_KNOWN_HOSTS_CONTENT}" > "${known_hosts}"
          chmod 600 "${known_hosts}"
          export CRABIT_GCP_KNOWN_HOSTS="${known_hosts}"
          ./scripts/deployment/google-cloud/verify-environment.sh stable-demo
          ./scripts/deployment/google-cloud/create-snapshot.sh \
            stable-demo "deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${snapshot_proof}"
          ./scripts/deployment/google-cloud/render-runtime-env.sh stable-demo "${runtime_env}"
          printf 'CRABIT_RECAP_GENERATION_CREDENTIAL=%s\n' \
            "${CRABIT_RECAP_GENERATION_CREDENTIAL}" >> "${runtime_env}"
          tar -czf "${archive}" deploy scripts/deployment
          ./scripts/deployment/google-cloud/run-over-iap.sh \
            stable-demo "${archive}" "${runtime_env}" "${snapshot_proof}" deploy.sh \
            "${IMAGE_DIGEST}" "${RECAP_IMAGE_DIGEST}" demo
