name: Publish Backend and Deploy Stable Demo

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: backend-publication-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: crabitteam2/crabit-backend

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: dockerhub
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify source and image
        run: |
          ./gradlew test --tests '*Demo*' --tests '*SeedFixture*' --tests '*SeedAuthenticationIT' --tests '*PostgresMigrationIT' --console=plain
          ./gradlew test --console=plain
          image="crabit-backend:sha-${GITHUB_SHA:0:12}"
          docker build --provenance=false --metadata-file "${RUNNER_TEMP}/tested-image-metadata.json" \
            --build-arg "VCS_REF=${GITHUB_SHA}" --tag "${image}" .
          jq -e '.["containerimage.digest"] | test("^sha256:[0-9a-f]{64}$")' \
            "${RUNNER_TEMP}/tested-image-metadata.json" >/dev/null
          jq -e '.["containerimage.config.digest"] | test("^sha256:[0-9a-f]{64}$")' \
            "${RUNNER_TEMP}/tested-image-metadata.json" >/dev/null
          ./scripts/deployment/verify-image.sh "${image}" "${GITHUB_SHA}"
          ./scripts/deployment/verify-runtime.sh "${image}"
          ./scripts/deployment/verify-workflows.sh
          git diff --check
      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish or adopt immutable commit tag
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="sha-${GITHUB_SHA:0:12}"
          local_image="crabit-backend:${tag}"
          image="${IMAGE_REPOSITORY}:${tag}"
          metadata="${RUNNER_TEMP}/tested-image-metadata.json"
          local_manifest_digest="$(jq -r '.["containerimage.digest"] // empty' "${metadata}")"
          local_config_digest="$(jq -r '.["containerimage.config.digest"] // empty' "${metadata}")"
          [[ "${local_manifest_digest}" =~ ^sha256:[0-9a-f]{64}$ \
            && "${local_config_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'local tested image identity is invalid' >&2
            exit 1
          }
          extract_digest() {
            local output="$1"
            local resolved
            resolved="$(printf '%s\n' "${output}" | sed -nE 's/.*[Dd]igest: (sha256:[0-9a-f]{64})([[:space:]].*)?$/\1/p')"
            [[ "${resolved}" =~ ^sha256:[0-9a-f]{64}$ && "${resolved}" != *$'\n'* ]] || {
              echo 'registry digest read-back failed' >&2
              return 1
            }
            printf '%s\n' "${resolved}"
          }
          if pull_output="$(docker pull "${image}" 2>&1)"; then
            digest="$(extract_digest "${pull_output}")"
          elif printf '%s\n' "${pull_output}" | grep -Eiq 'manifest unknown|manifest for [^[:space:]]+ not found'; then
            docker tag "${local_image}" "${image}"
            push_output="$(docker push "${image}")"
            digest="$(extract_digest "${push_output}")"
            docker pull "${IMAGE_REPOSITORY}@${digest}" >/dev/null
          else
            printf '%s\n' "${pull_output}" >&2
            echo 'registry tag lookup failed; refusing to publish' >&2
            exit 1
          fi
          manifest="$(docker manifest inspect "${IMAGE_REPOSITORY}@${digest}")"
          media_type="$(jq -r '.mediaType // empty' <<< "${manifest}")"
          case "${media_type}" in
            application/vnd.docker.distribution.manifest.v2+json|application/vnd.oci.image.manifest.v1+json) ;;
            *) echo 'published digest is not a single-platform image manifest' >&2; exit 1 ;;
          esac
          config_digest="$(jq -r '.config.digest // empty' <<< "${manifest}")"
          [[ "${config_digest}" == "${local_config_digest}" ]] || {
            echo 'published image does not match the locally tested image' >&2
            exit 1
          }
          echo "image_digest=${digest}" >> "${GITHUB_OUTPUT}"

  deploy-stable-demo:
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: stable-demo
    concurrency:
      group: stable-demo-operations
      cancel-in-progress: false
    env:
      IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      PUBLIC_HOST: ${{ vars.CRABIT_PUBLIC_HOST }}
      DATABASE_NAME: ${{ vars.CRABIT_DATABASE_NAME }}
      DATABASE_USERNAME: ${{ vars.CRABIT_DATABASE_USERNAME }}
      COMPOSE_PROJECT: ${{ vars.CRABIT_COMPOSE_PROJECT }}
      DATABASE_PASSWORD: ${{ secrets.CRABIT_DATABASE_PASSWORD }}
      TOKEN_OWNER: ${{ secrets.CRABIT_DEMO_TOKEN_OWNER }}
      TOKEN_FRIEND: ${{ secrets.CRABIT_DEMO_TOKEN_FRIEND }}
      TOKEN_NONFRIEND: ${{ secrets.CRABIT_DEMO_TOKEN_NONFRIEND }}
      TOKEN_BLOCKED: ${{ secrets.CRABIT_DEMO_TOKEN_BLOCKED }}
      TOKEN_OTHER_ACADEMY: ${{ secrets.CRABIT_DEMO_TOKEN_OTHER_ACADEMY }}
      TOKEN_STAFF: ${{ secrets.CRABIT_DEMO_TOKEN_STAFF }}
      BALANCE_PROVIDER_URL: ${{ vars.CRABIT_DEMO_BALANCE_PROVIDER_URL }}
      BALANCE_PROVIDER_TOKEN: ${{ secrets.CRABIT_DEMO_BALANCE_PROVIDER_TOKEN }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the just-published main digest
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${DEPLOY_HOST}" =~ ^[A-Za-z0-9.-]+$ && "${DEPLOY_PORT}" =~ ^[0-9]{1,5}$ && "${DEPLOY_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "${PUBLIC_HOST}" =~ ^[A-Za-z0-9.-]+$ && "${DATABASE_NAME}" =~ ^[A-Za-z0-9_]+$ && "${DATABASE_USERNAME}" =~ ^[A-Za-z0-9_]+$ && "${COMPOSE_PROJECT}" =~ ^[A-Za-z0-9_-]+$ ]]
          for secret in DATABASE_PASSWORD TOKEN_OWNER TOKEN_FRIEND TOKEN_NONFRIEND TOKEN_BLOCKED TOKEN_OTHER_ACADEMY TOKEN_STAFF; do
            [[ "${!secret}" =~ ^[A-Za-z0-9_-]{16,}$ ]] || { echo "${secret} must be base64url-safe" >&2; exit 1; }
          done
          [[ "${BALANCE_PROVIDER_URL}" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/api/provider/balance-lookups$ ]] || { echo 'BALANCE_PROVIDER_URL must target the exact HTTPS provider endpoint' >&2; exit 1; }
          [[ "${BALANCE_PROVIDER_TOKEN}" =~ ^[A-Za-z0-9_-]{32,}$ ]] || { echo 'BALANCE_PROVIDER_TOKEN must be a base64url-safe machine credential' >&2; exit 1; }
          umask 077
          key_file="${RUNNER_TEMP}/deploy-key"
          known_hosts="${RUNNER_TEMP}/known-hosts"
          runtime_env="${RUNNER_TEMP}/runtime.env"
          archive="${RUNNER_TEMP}/deployment.tgz"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${key_file}"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${known_hosts}"
          {
            printf 'CRABIT_ENV=stable-demo\nCRABIT_COMPOSE_PROJECT=%s\nCRABIT_SPRING_PROFILE=demo\n' "${COMPOSE_PROJECT}"
            printf 'CRABIT_PUBLIC_HOST=%s\nCRABIT_DATABASE_NAME=%s\nCRABIT_DATABASE_USERNAME=%s\n' "${PUBLIC_HOST}" "${DATABASE_NAME}" "${DATABASE_USERNAME}"
            printf 'CRABIT_DATABASE_PASSWORD=%s\n' "${DATABASE_PASSWORD}"
            printf 'CRABIT_DEMO_TOKEN_OWNER=%s\nCRABIT_DEMO_TOKEN_FRIEND=%s\n' "${TOKEN_OWNER}" "${TOKEN_FRIEND}"
            printf 'CRABIT_DEMO_TOKEN_NONFRIEND=%s\nCRABIT_DEMO_TOKEN_BLOCKED=%s\n' "${TOKEN_NONFRIEND}" "${TOKEN_BLOCKED}"
            printf 'CRABIT_DEMO_TOKEN_OTHER_ACADEMY=%s\nCRABIT_DEMO_TOKEN_STAFF=%s\n' "${TOKEN_OTHER_ACADEMY}" "${TOKEN_STAFF}"
            printf 'CRABIT_DEMO_BALANCE_PROVIDER_URL=%s\nCRABIT_DEMO_BALANCE_PROVIDER_TOKEN=%s\n' "${BALANCE_PROVIDER_URL}" "${BALANCE_PROVIDER_TOKEN}"
          } > "${runtime_env}"
          tar -czf "${archive}" deploy scripts/deployment
          ssh_opts=(-p "${DEPLOY_PORT}" -i "${key_file}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${known_hosts}")
          scp_opts=(-P "${DEPLOY_PORT}" -i "${key_file}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${known_hosts}")
          release=".local/share/crabit/releases/${GITHUB_SHA}"
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${release}'"
          scp "${scp_opts[@]}" "${archive}" "${runtime_env}" "${DEPLOY_USER}@${DEPLOY_HOST}:${release}/"
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" "chmod 600 '${release}/runtime.env' && tar -xzf '${release}/deployment.tgz' -C '${release}' && chmod 700 '${release}/scripts/deployment/'*.sh && CRABIT_RUNTIME_ENV='${release}/runtime.env' '${release}/scripts/deployment/deploy.sh' '${IMAGE_DIGEST}' demo"
