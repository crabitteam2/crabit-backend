name: Reset Stable Demo

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RESET_STABLE_DEMO
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-demo-operations
  cancel-in-progress: false

jobs:
  reset:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'RESET_STABLE_DEMO'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: stable-demo
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      PUBLIC_HOST: ${{ vars.CRABIT_PUBLIC_HOST }}
      DATABASE_NAME: ${{ vars.CRABIT_DATABASE_NAME }}
      DATABASE_USERNAME: ${{ vars.CRABIT_DATABASE_USERNAME }}
      COMPOSE_PROJECT: ${{ vars.CRABIT_COMPOSE_PROJECT }}
      DATABASE_PASSWORD: ${{ secrets.CRABIT_DATABASE_PASSWORD }}
      TOKEN_OWNER: ${{ secrets.CRABIT_DEMO_TOKEN_OWNER }}
      TOKEN_FRIEND: ${{ secrets.CRABIT_DEMO_TOKEN_FRIEND }}
      TOKEN_NONFRIEND: ${{ secrets.CRABIT_DEMO_TOKEN_NONFRIEND }}
      TOKEN_BLOCKED: ${{ secrets.CRABIT_DEMO_TOKEN_BLOCKED }}
      TOKEN_OTHER_ACADEMY: ${{ secrets.CRABIT_DEMO_TOKEN_OTHER_ACADEMY }}
      TOKEN_STAFF: ${{ secrets.CRABIT_DEMO_TOKEN_STAFF }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Stop service, reset with the same digest, and verify recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${DEPLOY_HOST}" =~ ^[A-Za-z0-9.-]+$ && "${DEPLOY_PORT}" =~ ^[0-9]{1,5}$ && "${DEPLOY_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]
          for secret in DATABASE_PASSWORD TOKEN_OWNER TOKEN_FRIEND TOKEN_NONFRIEND TOKEN_BLOCKED TOKEN_OTHER_ACADEMY TOKEN_STAFF; do
            [[ "${!secret}" =~ ^[A-Za-z0-9_-]{16,}$ ]] || { echo "${secret} must be base64url-safe" >&2; exit 1; }
          done
          umask 077
          key_file="${RUNNER_TEMP}/deploy-key"
          known_hosts="${RUNNER_TEMP}/known-hosts"
          runtime_env="${RUNNER_TEMP}/runtime.env"
          archive="${RUNNER_TEMP}/deployment.tgz"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${key_file}"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${known_hosts}"
          {
            printf 'CRABIT_ENV=stable-demo\nCRABIT_COMPOSE_PROJECT=%s\nCRABIT_SPRING_PROFILE=demo\n' "${COMPOSE_PROJECT}"
            printf 'CRABIT_PUBLIC_HOST=%s\nCRABIT_DATABASE_NAME=%s\nCRABIT_DATABASE_USERNAME=%s\n' "${PUBLIC_HOST}" "${DATABASE_NAME}" "${DATABASE_USERNAME}"
            printf 'CRABIT_DATABASE_PASSWORD=%s\n' "${DATABASE_PASSWORD}"
            printf 'CRABIT_DEMO_TOKEN_OWNER=%s\nCRABIT_DEMO_TOKEN_FRIEND=%s\n' "${TOKEN_OWNER}" "${TOKEN_FRIEND}"
            printf 'CRABIT_DEMO_TOKEN_NONFRIEND=%s\nCRABIT_DEMO_TOKEN_BLOCKED=%s\n' "${TOKEN_NONFRIEND}" "${TOKEN_BLOCKED}"
            printf 'CRABIT_DEMO_TOKEN_OTHER_ACADEMY=%s\nCRABIT_DEMO_TOKEN_STAFF=%s\n' "${TOKEN_OTHER_ACADEMY}" "${TOKEN_STAFF}"
          } > "${runtime_env}"
          tar -czf "${archive}" deploy scripts/deployment
          ssh_opts=(-p "${DEPLOY_PORT}" -i "${key_file}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${known_hosts}")
          scp_opts=(-P "${DEPLOY_PORT}" -i "${key_file}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${known_hosts}")
          release=".local/share/crabit/releases/${GITHUB_SHA}"
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${release}'"
          scp "${scp_opts[@]}" "${archive}" "${runtime_env}" "${DEPLOY_USER}@${DEPLOY_HOST}:${release}/"
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" "chmod 600 '${release}/runtime.env' && tar -xzf '${release}/deployment.tgz' -C '${release}' && chmod 700 '${release}/scripts/deployment/'*.sh && CRABIT_RUNTIME_ENV='${release}/runtime.env' '${release}/scripts/deployment/reset-stable-demo.sh'"
