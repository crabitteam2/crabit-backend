name: Reset Stable Demo

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RESET_STABLE_DEMO
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: stable-demo-operations
  cancel-in-progress: false

jobs:
  reset:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'RESET_STABLE_DEMO'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: stable-demo
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      CRABIT_PUBLIC_HOST: ${{ vars.CRABIT_PUBLIC_HOST }}
      CRABIT_WISH_PHOTO_ENABLED: ${{ vars.CRABIT_WISH_PHOTO_ENABLED || 'false' }}
      CRABIT_DATABASE_NAME: ${{ vars.CRABIT_DATABASE_NAME }}
      CRABIT_DATABASE_USERNAME: ${{ vars.CRABIT_DATABASE_USERNAME }}
      CRABIT_COMPOSE_PROJECT: ${{ vars.CRABIT_COMPOSE_PROJECT }}
      CRABIT_DATABASE_PASSWORD: ${{ secrets.CRABIT_DATABASE_PASSWORD }}
      CRABIT_DEMO_TOKEN_OWNER: ${{ secrets.CRABIT_DEMO_TOKEN_OWNER }}
      CRABIT_DEMO_TOKEN_FRIEND: ${{ secrets.CRABIT_DEMO_TOKEN_FRIEND }}
      CRABIT_DEMO_TOKEN_NONFRIEND: ${{ secrets.CRABIT_DEMO_TOKEN_NONFRIEND }}
      CRABIT_DEMO_TOKEN_BLOCKED: ${{ secrets.CRABIT_DEMO_TOKEN_BLOCKED }}
      CRABIT_DEMO_TOKEN_OTHER_ACADEMY: ${{ secrets.CRABIT_DEMO_TOKEN_OTHER_ACADEMY }}
      CRABIT_DEMO_TOKEN_STAFF: ${{ secrets.CRABIT_DEMO_TOKEN_STAFF }}
      CRABIT_DEMO_BALANCE_PROVIDER_URL: ${{ vars.CRABIT_DEMO_BALANCE_PROVIDER_URL }}
      CRABIT_DEMO_BALANCE_PROVIDER_TOKEN: ${{ secrets.CRABIT_DEMO_BALANCE_PROVIDER_TOKEN }}
      CRABIT_GCP_KNOWN_HOSTS_CONTENT: ${{ secrets.CRABIT_GCP_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 500.0.0"
      - name: Snapshot, reset with the same digest, and verify recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          known_hosts="${RUNNER_TEMP}/known-hosts"
          runtime_env="${RUNNER_TEMP}/runtime.env"
          snapshot_proof="${RUNNER_TEMP}/snapshot-proof.env"
          archive="${RUNNER_TEMP}/deployment.tgz"
          printf '%s\n' "${CRABIT_GCP_KNOWN_HOSTS_CONTENT}" > "${known_hosts}"
          chmod 600 "${known_hosts}"
          export CRABIT_GCP_KNOWN_HOSTS="${known_hosts}"
          ./scripts/deployment/google-cloud/verify-environment.sh stable-demo
          ./scripts/deployment/google-cloud/create-snapshot.sh \
            stable-demo "reset-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${snapshot_proof}"
          ./scripts/deployment/google-cloud/render-runtime-env.sh stable-demo "${runtime_env}"
          tar -czf "${archive}" deploy scripts/deployment
          ./scripts/deployment/google-cloud/run-over-iap.sh \
            stable-demo "${archive}" "${runtime_env}" "${snapshot_proof}" reset-stable-demo.sh
