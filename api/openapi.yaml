    StudentBlockConflict:
      description: "SELF_RELATIONSHIP 또는 STUDENT_BLOCK_ALREADY_ACTIVE."
      x-error-codes: [SELF_RELATIONSHIP, STUDENT_BLOCK_ALREADY_ACTIVE]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          examples:
            self: {$ref: '#/components/examples/SelfRelationshipConflict'}
            already-active: {$ref: '#/components/examples/StudentBlockAlreadyActiveConflict'}
  schemas:
    Uuid:
      type: string
      format: uuid
    UtcInstant:
      type: string
      format: date-time
      pattern: 'Z$'
      description: "RFC 3339 UTC 와이어 표현이 Z로 끝나는 인스턴스입니다."
    UtcDate:
      type: string
      format: date
    Cursor:
      type: string
      minLength: 1
    KrwSigned:
      type: integer
      format: int64
      minimum: -9007199254740991
      maximum: 9007199254740991
      description: "분수 KRW는 허용되지 않습니다."
    KrwNonNegative:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    KrwPositive:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
    WishVersion:
      type: integer
      format: int64
      minimum: 0
      description: "누락되거나 정수가 아닌 필수 요청 버전은 400 MALFORMED_REQUEST으로 유지됩니다. 디코딩된 네거티브 버전은 422 INVALID_VERSION를 반환합니다. 음수가 아닌 오래된 버전은 409 VERSION_CONFLICT를 반환합니다."
    Purpose:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^(?!\p{Zs})(?!.*\p{Zs}$)(?!.*[\p{Cc}\p{Cf}\p{Zl}\p{Zp}]).+$'
      description: "NFC 1~200개의 코드 포인트를 포함하는 정규화된 경계 공백 없는 유니코드 텍스트입니다. Cc, Cf, Zl 및 Zp 문자는 금지됩니다. 내부 Space_Separator 문자는 유지됩니다."
    PurposeInput:
      type: string
      description: "목적 요청 정규화 순서는 다음과 같습니다.\n1. 요청 값을 문자열로 디코딩합니다.\n2. 422 INVALID_PURPOSE를 사용하여 유니코드 일반 범주 Cc, Cf, Zl 또는 Zp를 포함하는 디코딩된 입력을 거부합니다.\n3. ASCII SPACE 및 NBSP U+00A0를 포함하여 모든 선행 및 후행 유니코드 Space_Separator 코드 포인트(일반 범주 Zs)를 반복적으로 제거합니다. 내부 공간을 보존합니다.\n4. 경계가 잘린 값을 유니코드 NFC로 정규화합니다.\n5. NFC 정규화 후 유니코드 코드 포인트를 계산합니다. 1~200개의 유니코드 코드 포인트를 포함하는 값을 유지하고 반환합니다. 그렇지 않으면 422 INVALID_PURPOSE를 반환합니다."
    WishState:
      type: string
      enum: [IN_PROGRESS, AMOUNT_REACHED, COMPLETED, ABANDONED]
    WishVisibility:
      type: string
      enum: [PRIVATE, FRIENDS, ACADEMY]
    BalanceLookupMethod:
      type: string
      enum: [USER_REQUESTED, PRE_DEPOSIT, AUTO_DAILY]
    LedgerEventType:
      type: string
      enum: [CARD_BALANCE_CHANGE, WISH_DEPOSIT, WISH_WITHDRAWAL, WISH_TRANSFER, WISH_COMPLETION_RETURN, WISH_ABANDONMENT_RETURN, WISH_DELETION_RETURN]
    BalanceAdjustmentStatus:
      type: string
      enum: [OPEN, RESOLVED]
      description: "내부 계정 조정 상태 어휘는 소유자 오류 세부 정보에만 사용되며 공유 카드 예측에는 사용되지 않습니다."
    ErrorCode:
      type: string
      enum:
        - MALFORMED_REQUEST
        - EXPECTED_VERSION_REQUIRED
        - IDEMPOTENCY_KEY_REQUIRED
        - AUTH_REQUIRED
        - FORBIDDEN
        - CARD_BALANCE_ACCOUNT_NOT_FOUND
        - WISH_NOT_FOUND
        - ACADEMY_NOT_FOUND
        - SHARED_CARD_NOT_FOUND
        - VERSION_CONFLICT
        - INVALID_STATE_TRANSITION
        - BALANCE_MISMATCH_LOCKED
        - INSUFFICIENT_AVAILABLE_BALANCE
        - INSUFFICIENT_WISH_AMOUNT
        - TARGET_AMOUNT_EXCEEDED
        - CROSS_ACCOUNT_TRANSFER_FORBIDDEN
        - IDEMPOTENCY_KEY_REUSED
        - UNSUPPORTED_MEDIA_TYPE
        - INVALID_AMOUNT
        - INVALID_PURPOSE
        - INVALID_VERSION
        - BALANCE_SYNC_FAILED
        - STUDENT_NOT_FOUND
        - FRIENDSHIP_NOT_FOUND
        - FRIEND_REQUEST_NOT_FOUND
        - STUDENT_BLOCK_NOT_FOUND
        - SELF_RELATIONSHIP
        - ALREADY_FRIENDS
        - FRIEND_REQUEST_ALREADY_PENDING
        - INCOMING_FRIEND_REQUEST_PENDING
        - FRIEND_REQUEST_NOT_PENDING
        - FRIEND_REQUEST_NOT_ACTIONABLE
        - STUDENT_BLOCK_ALREADY_ACTIVE
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field: {type: string, minLength: 1, description: "이 유효성 검사 실패와 관련된 잘못된 요청 필드, 매개 변수 또는 헤더의 이름입니다."}
        message: {type: string, minLength: 1, description: "현장별 오류에 대한 사람이 읽을 수 있는 설명입니다."}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          description: "선언된 모든 비성공 JSON 응답에서 공유되는 구조적 오류 페이로드입니다."
          type: object
          additionalProperties: false
          required: [code, message, retryable, traceId, fieldErrors, details]
          allOf:
            - if:
                properties:
                  code: {const: BALANCE_SYNC_FAILED}
              then:
                properties:
                  retryable: {const: true}
              else:
                properties:
                  retryable: {const: false}
          properties:
            code: {$ref: '#/components/schemas/ErrorCode', description: "안정적인 기계 판독 가능 ErrorCode; 클라이언트는 메시지 텍스트가 아닌 이 값을 기준으로 분기해야 합니다."}
            message: {type: string, minLength: 1, description: "이 사건에 대한 사람이 읽을 수 있는 설명 이는 안정적인 기계 결정 키가 아닙니다."}
            retryable:
              type: boolean
              description: "BALANCE_SYNC_FAILED에 대해서만 참입니다. 정의된 모든 클라이언트, 권한 부여, 찾을 수 없음, 유효성 검사 및 상태 충돌 오류에 대해 false입니다."
            traceId: {type: string, minLength: 1, description: "진단 및 지원을 위한 불투명한 서버 상관 관계 식별자. 도메인 의미가 없습니다."}
            fieldErrors:
              description: "분야별 검증 실패 오류가 개별 요청 필드로 인해 발생하지 않은 경우에는 비어 있습니다."
              type: array
              items: {$ref: '#/components/schemas/FieldError'}
            details:
              description: "확장 가능한 코드별 메타데이터 개체. 세부 사항이 적용되지 않으면 비어 있으며 클라이언트는 인식할 수 없는 키를 무시해야 합니다."
              type: object
              additionalProperties: true
    RelationshipState:
      type: string
      enum: [NONE, FRIEND, OUTGOING_PENDING, INCOMING_PENDING]
      description: "인증된 학생과 동일한 학원 검색 결과 간의 현재 관계(응답 조회 시점에 계산됨)"
    FriendRequestStatus:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED, CANCELED]
      description: "현재 요청 수명주기 상태. 처리된 요청은 PENDING로 반환되지 않습니다."
    StudentSummary:
      type: object
      additionalProperties: false
      required: [studentId, nickname]
      description: "실명, 카드 데이터, 위시 데이터, 인증 데이터 또는 학원 회원 내부 정보가 없는 개인정보 보호를 최소화한 학생 프로젝션입니다."
      properties:
        studentId: {$ref: '#/components/schemas/Uuid', description: "예상되는 상대 학생의 안정적인 UUID입니다."}
        nickname: {type: string, minLength: 1, maxLength: 80, description: "최대 80개의 유니코드 코드 포인트를 포함하는 현재 공백이 아닌 학생 닉네임입니다."}
    StudentRelationship:
      type: object
      additionalProperties: false
      required: [studentId, nickname, relationshipState]
      properties:
        studentId: {$ref: '#/components/schemas/Uuid', description: "동일 학원 검색 결과의 안정적인 UUID입니다."}
        nickname: {type: string, minLength: 1, maxLength: 80, description: "결정론적 검색 순서에 사용되는 현재 비어 있지 않은 별명입니다."}
        relationshipState: {$ref: '#/components/schemas/RelationshipState', description: "인증된 학생에 대해 정확히 하나의 현재 관계 상태가 계산됩니다."}
    StudentRelationshipPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          description: "동일 학원 경기는 닉네임 오름차순, studentId 자신 이후 오름차순, 비현재 멤버십 및 양측 차단 제외 순으로 정렬됩니다."
          type: array
          items: {$ref: '#/components/schemas/StudentRelationship'}
        nextCursor: {type: [string, 'null'], minLength: 1, description: "최종 반환된 (닉네임, studentId) 튜플 및 정규화된 닉네임 필터에서 파생된 불투명 커서입니다. 더 이상 항목이 없으면 null입니다."}
    Friend:
      type: object
      additionalProperties: false
      required: [studentId, nickname, friendsSince]
      properties:
        studentId: {$ref: '#/components/schemas/Uuid', description: "현재 친구의 마구간 UUID입니다."}
        nickname: {type: string, minLength: 1, maxLength: 80, description: "친구의 현재 공백이 아닌 별명입니다."}
        friendsSince: {$ref: '#/components/schemas/UtcInstant', description: "RFC 3339 UTC Z 현재 우정이 생성되거나 다시 시작된 순간입니다."}
    FriendPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          description: "현재 학원 친구는 friendsSince 내림차순, studentId 내림차순으로 정렬됩니다."
          type: array
          items: {$ref: '#/components/schemas/Friend'}
        nextCursor: {type: [string, 'null'], minLength: 1, description: "최종 반환된 (friendsSince, studentId) 튜플에서 파생된 불투명 커서입니다. 더 이상 항목이 없으면 null입니다."}
    CreateFriendRequestRequest:
      type: object
      additionalProperties: false
      required: [studentId]
      description: "수신자에게만 이름을 지정하는 페이로드를 요청합니다. 발신자는 항상 CurrentPrincipal.subjectId에서 옵니다."
      properties:
        studentId: {$ref: '#/components/schemas/Uuid', description: "UUID 현재 동일한 학원 수신자가 의도한 것입니다."}
    FriendRequest:
      type: object
      additionalProperties: false
      required: [friendRequestId, counterpart, status, createdAt, processedAt]
      description: "개인 정보 보호를 최소화한 친구 요청 투영. 상대방은 전송된 결과의 수신자이고 수신된 결과의 전송자입니다."
      properties:
        friendRequestId: {$ref: '#/components/schemas/Uuid', description: "이 친구 요청의 안정적인 UUID입니다."}
        counterpart: {$ref: '#/components/schemas/StudentSummary', description: "전송된 결과의 수신자 및 수신된 결과의 전송자 소유권 식별자는 별도로 노출되지 않습니다."}
        status: {$ref: '#/components/schemas/FriendRequestStatus', description: "현재 요청 수명주기 상태입니다."}
        createdAt: {$ref: '#/components/schemas/UtcInstant', description: "RFC 3339 UTC Z 이 요청이 생성된 순간입니다."}
        processedAt:
          description: "RFC 3339 UTC Z ACCEPTED, REJECTED 또는 CANCELED에 대한 인스턴트 처리 중입니다. PENDING 동안에만 null입니다."
          oneOf: [{$ref: '#/components/schemas/UtcInstant'}, {type: 'null'}]
      allOf:
        - oneOf:
            - properties:
                status: {const: PENDING, description: "PENDING 처리되지 않은 요청이 필요한 분기 판별자입니다."}
                processedAt: {type: 'null', description: "상태가 PENDING인 동안에는 null로 유지되어야 합니다."}
            - properties:
                status: {enum: [ACCEPTED, REJECTED, CANCELED], description: "터미널 요청 상태에 대해 처리된 분기 판별자입니다."}
                processedAt: {$ref: '#/components/schemas/UtcInstant', description: "모든 터미널 요청 상태에 대해 즉시 처리가 필요합니다."}
    FriendRequestPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          description: "행위자 소유 PENDING 요청은 createdAt 내림차순, friendRequestId 내림차순으로 정렬됩니다."
          type: array
          items: {$ref: '#/components/schemas/FriendRequest'}
        nextCursor: {type: [string, 'null'], minLength: 1, description: "최종 반환된 (createdAt, friendRequestId) 튜플에서 파생된 불투명 커서입니다. 더 이상 항목이 없으면 null입니다."}
    CreateStudentBlockRequest:
      type: object
      additionalProperties: false
      required: [studentId]
      description: "차단된 학생에게만 이름을 지정하는 페이로드를 요청합니다. 차단기는 항상 CurrentPrincipal.subjectId에서 발생합니다."
      properties:
        studentId: {$ref: '#/components/schemas/Uuid', description: "전역적으로 차단할 학생의 UUID입니다."}
    StudentBlock:
      type: object
      additionalProperties: false
      required: [studentId, nickname, blockedAt]
      properties:
        studentId: {$ref: '#/components/schemas/Uuid', description: "차단된 학생의 안정적인 UUID입니다."}
        nickname: {type: string, minLength: 1, maxLength: 80, description: "차단된 학생의 현재 공백이 아닌 별명입니다."}
        blockedAt: {$ref: '#/components/schemas/UtcInstant', description: "RFC 3339 UTC Z 현재 방향 블록이 생성되거나 다시 생성된 순간입니다."}
    StudentBlockPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          description: "인증된 학생이 생성한 활성 블록으로, blockedAt 내림차순, studentId 내림차순으로 정렬됩니다."
          type: array
          items: {$ref: '#/components/schemas/StudentBlock'}
        nextCursor: {type: [string, 'null'], minLength: 1, description: "최종 반환된 (blockedAt, studentId) 튜플에서 파생된 불투명 커서입니다. 더 이상 항목이 없으면 null입니다."}
    CardBalanceAccount:
      oneOf:
        - $ref: '#/components/schemas/UnknownCardBalanceAccount'
        - $ref: '#/components/schemas/KnownCardBalanceAccount'
      discriminator:
        propertyName: balanceKnowledge
        mapping:
          UNKNOWN: '#/components/schemas/UnknownCardBalanceAccount'
          KNOWN: '#/components/schemas/KnownCardBalanceAccount'
    UnknownCardBalanceAccount:
      type: object
      additionalProperties: false
      required: [cardBalanceAccountId, academyId, balanceKnowledge, actualCardBalance, ledgerAvailableBalance, displayAvailableBalance, unresolvedShortage, balanceAdjustmentInProgress, lastRefreshStatus, lastRefreshedAt]
      properties:
        cardBalanceAccountId: {$ref: '#/components/schemas/Uuid', description: "학생 카드 잔액 계정의 안정적인 UUID입니다."}
        academyId: {$ref: '#/components/schemas/Uuid', description: "이 카드 잔액 계정이 속한 학원의 UUID입니다."}
        balanceKnowledge: {type: string, const: UNKNOWN, description: "UNKNOWN는 성공적인 외부 잔액 관측이 존재하지 않음을 의미합니다. Null 잔액 값은 0으로 해석되어서는 안 됩니다."}
        actualCardBalance: {type: 'null', description: "성공적인 외부 균형 관측이 없으므로 항상 null입니다. null는 0이 아닌 알 수 없음을 의미합니다 KRW."}
        ledgerAvailableBalance: {type: 'null', description: "실제 카드 잔액이 알려질 때까지는 항상 null입니다. 서비스는 조작된 0에서 이를 계산해서는 안 됩니다."}
        displayAvailableBalance: {type: 'null', description: "실제 카드 잔액이 알려질 때까지는 항상 null입니다. UI는 0 KRW으로 표시되어서는 안 됩니다."}
        unresolvedShortage: {type: 'null', description: "실제 카드 잔액이 알려질 때까지는 항상 null입니다. 알려지지 않은 부족은 부족이 없다는 것과 다릅니다."}
        balanceAdjustmentInProgress: {type: boolean, const: false, description: "OPEN 잔액 조정 건에는 성공적인 잔액 관측이 필요하지만 UNKNOWN 계정에는 없기 때문에 항상 false입니다."}
        lastRefreshStatus:
          description: "FAILED 관측이 성공하기 전에 최신 조회 시도가 실패한 경우. 조회 시도가 기록되지 않은 경우 null입니다."
          type: [string, 'null']
          enum: [FAILED, null]
        lastRefreshedAt:
          description: "성공적인 관측이 없으므로 항상 null입니다. 대신 실패한 시도 시간이 관측 기록에 표시됩니다."
          type: ['null']
    KnownCardBalanceAccount:
      type: object
      additionalProperties: false
      required: [cardBalanceAccountId, academyId, balanceKnowledge, actualCardBalance, ledgerAvailableBalance, displayAvailableBalance, unresolvedShortage, balanceAdjustmentInProgress, lastRefreshStatus, lastRefreshedAt]
      properties:
        cardBalanceAccountId: {$ref: '#/components/schemas/Uuid', description: "학생 카드 잔액 계정의 안정적인 UUID입니다."}
        academyId: {$ref: '#/components/schemas/Uuid', description: "이 카드 잔액 계정이 속한 학원의 UUID입니다."}
        balanceKnowledge: {type: string, const: KNOWN, description: "KNOWN는 하나 이상의 성공적인 외부 잔액 관측이 반환된 잔액 값을 제공함을 의미합니다."}
        actualCardBalance: {$ref: '#/components/schemas/KrwNonNegative', description: "가장 최근에 성공한 외부 카드 잔액 조회에서 관측된 음수가 아닌 정수 KRW입니다."}
        ledgerAvailableBalance: {$ref: '#/components/schemas/KrwSigned', description: "부호 있는 정수 KRW는 actualCardBalance에서 활성 Wish가 보유한 총계를 뺀 것과 같습니다. 음수 값이 유지됩니다."}
        displayAvailableBalance: {$ref: '#/components/schemas/KrwNonNegative', description: "표시할 최대값(0, ledgerAvailableBalance)과 동일한 음수가 아닌 정수 KRW입니다."}
        unresolvedShortage: {$ref: '#/components/schemas/KrwNonNegative', description: "음수가 아닌 정수 KRW는 max(0, -ledgerAvailableBalance)와 같습니다. 0은 해결되지 않은 부족이 없음을 의미합니다."}
        balanceAdjustmentInProgress: {type: boolean, description: "응답 조회 시점에 계정 범위 잔액 조정 건이 OPEN인 경우 참입니다. RESOLVED 전용 기록을 포함하여 OPEN 사례가 존재하지 않으면 false입니다. 계정에 지속되기보다는 파생된 이 플래그와 잔액 필드는 하나의 일관된 계정 예측에서 나옵니다. 나중에 실패한 조회는 플래그에 현재 사례를 반영하는 동안 가장 최근에 성공한 금액을 유지합니다."}
        lastRefreshStatus: {type: string, enum: [SUCCESS, FAILED], description: "가장 최근 조회 시도의 결과입니다. FAILED는 이전의 성공적인 관측에서 보존된 금액과 공존할 수 있습니다."}
        lastRefreshedAt: {$ref: '#/components/schemas/UtcInstant', description: "RFC 3339 UTC Z 반환된 금액을 뒷받침하는 성공적인 관측의 순간입니다. 나중에 조회가 실패하면 유지됩니다."}
    CardBalanceAccountPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          description: "이 페이지에서 인증된 학생이 볼 수 있는 카드 잔액 계정입니다."
          type: array
          items: {$ref: '#/components/schemas/CardBalanceAccount'}
        nextCursor:
          description: "다음 계정 페이지에 대한 불투명 커서. 추가 페이지가 없으면 null입니다."
          type: [string, 'null']
          minLength: 1
    BalanceRefreshResult:
      type: object
      additionalProperties: false
      required: [observationId, lookupMethod, observedAt, account]
      properties:
        observationId: {$ref: '#/components/schemas/Uuid', description: "새로 지속된 성공적인 잔액 관측의 UUID입니다."}
        lookupMethod:
          description: "이 공개 본문 없는 작업은 사용자가 요청한 조회를 수행하고 클라이언트가 선택한 방법을 허용하지 않으므로 항상 USER_REQUESTED입니다."
          type: string
          const: USER_REQUESTED
        observedAt: {$ref: '#/components/schemas/UtcInstant', description: "RFC 3339 UTC Z 이 외부 잔액 조회 시도가 이루어진 순간입니다."}
        account: {$ref: '#/components/schemas/KnownCardBalanceAccount', description: "이 성공적인 관측에서 파생된 KNOWN 카드 잔액 계정 스냅샷을 업데이트했습니다."}
    CardBalanceChange:
      type: object
      additionalProperties: false
      required: [eventId, eventType, observationId, lookupMethod, occurredAt, actualCardBalanceDelta, actualCardBalanceAfter, correctionOfEventId, balanceAdjustment]
      properties:
        eventId: {$ref: '#/components/schemas/Uuid', description: "변경할 수 없는 CARD_BALANCE_CHANGE 원장 이벤트의 UUID 동일한 값이 계정 자금 이동 내역에서 이 사실을 식별합니다."}
        eventType: {type: string, const: CARD_BALANCE_CHANGE, description: "관측 실패 및 성공적인 제로 델타 관측은 자금 기록 이벤트를 생성하지 않기 때문에 항상 CARD_BALANCE_CHANGE입니다."}
        observationId: {$ref: '#/components/schemas/Uuid', description: "이 불변 이벤트에 연결된 정확한 성공적인 외부 잔액 관측의 UUID."}
        lookupMethod: {$ref: '#/components/schemas/BalanceLookupMethod', description: "이 조회에 대한 트리거: USER_REQUESTED, PRE_DEPOSIT 또는 AUTO_DAILY."}
        occurredAt: {$ref: '#/components/schemas/UtcInstant', description: "RFC 3339 UTC Z 인스턴트는 연결된 성공한 관측의 observedAt 값과 같습니다."}
        actualCardBalanceDelta:
          description: "0이 아닌 부호 있는 정수 KRW는 이전에 성공적으로 관측된 잔액에서 변경되거나 첫 번째 성공적인 관측에 대해 0에서 변경됩니다."
          allOf:
            - $ref: '#/components/schemas/KrwSigned'
            - not: {const: 0}
        actualCardBalanceAfter: {$ref: '#/components/schemas/KrwNonNegative', description: "이 성공적인 조회로 관측된 음수가 아닌 정수 KRW입니다."}
        correctionOfEventId: {type: [string, 'null'], format: uuid, description: "이 새로운 이벤트가 보상하는 동일한 계정의 이전 불변 이벤트의 UUID 수정사항이 아닌 경우 null입니다. 이전 이벤트는 변경되지 않습니다."}
        balanceAdjustment:
          description: "이 원장 이벤트에 대한 불변 잔액 조정 건 이벤트 링크 출처 또는 이벤트가 조정 사례에 연결되지 않은 경우 null입니다."
          oneOf:
            - $ref: '#/components/schemas/BalanceAdjustmentEventReference'
            - type: 'null'
    CardBalanceChangePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          description: "occurredAt 내림차순, eventId 내림차순의 0이 아닌 불변 CARD_BALANCE_CHANGE 이벤트. 실패하고 제로 델타 관측치는 제외됩니다."
          type: array
          items: {$ref: '#/components/schemas/CardBalanceChange'}
        nextCursor: {type: [string, 'null'], minLength: 1, description: "다른 항목이 존재할 때 최종 반환된 (occurredAt, eventId) 튜플에서 파생된 불투명 커서입니다. 빈 페이지와 터미널 페이지의 경우 null입니다."}
    Wish:
      type: object
      additionalProperties: false
      required: [id, cardBalanceAccountId, purpose, targetAmount, amount, targetDate, state, visibility, balanceAdjustmentInProgress, createdAt, updatedAt, completedAt, actualDurationSeconds, version]
      properties:
        id: {$ref: '#/components/schemas/Uuid', description: "이 Wish의 안정적인 UUID입니다."}
        cardBalanceAccountId: {$ref: '#/components/schemas/Uuid', description: "이 Wish가 영구적으로 연결된 소유자 카드 잔액 계정의 UUID."}
        purpose: {$ref: '#/components/schemas/Purpose', description: "NFC 정규화되고 경계 공간이 없는 목적 텍스트가 이 Wish에 대해 지속됩니다."}
        targetAmount: {$ref: '#/components/schemas/KrwPositive', description: "이 Wish에 대한 양의 정수 KRW 목표입니다."}
        amount: {$ref: '#/components/schemas/KrwNonNegative', description: "현재 이 Wish에 할당된 음수가 아닌 정수 KRW입니다. 실제 카드 잔액과 다르며 targetAmount를 초과하지 않습니다."}
        targetDate:
          type: [string, 'null']
          format: date
          description: "과거, 현재 또는 미래일 수 있는 선택적 달력 날짜입니다."
        state: {$ref: '#/components/schemas/WishState', description: "수명주기 상태: 대상 미만 IN_PROGRESS, 명시적 완료 전 대상의 AMOUNT_REACHED, 완료 후 COMPLETED 또는 포기 후 ABANDONED."}
        visibility: {$ref: '#/components/schemas/WishVisibility', description: "요청된 게시 범위 PRIVATE, FRIENDS 또는 ACADEMY; 현재 관계 및 차단 확인으로 인해 공유 카드가 더 숨겨질 수 있습니다."}
        balanceAdjustmentInProgress: {type: boolean, description: "이 Wish의 카드 잔액 계정에 이 응답 스냅샷에 대한 OPEN 잔액 조정 건이 있는 경우 참입니다. 위시 또는 공유 카드에서 파생되었으며 지속되지 않습니다. 목록 및 세부 응답은 읽은 시간을 반영하고, 변경 응답은 커밋된 변경 이후 상태를 반영하며, 케이스를 열거나 해결해도 위시 버전 또는 updatedAt가 향상되지 않습니다. 이 예측은 부족하지 않은 부울 금액, adjustmentCaseId, observationId, 이벤트 링크 또는 계정 기록만 노출합니다."}
        createdAt: {$ref: '#/components/schemas/UtcInstant', description: "RFC 3339 UTC Z Wish가 생성된 순간입니다."}
        updatedAt: {$ref: '#/components/schemas/UtcInstant', description: "RFC 3339 UTC Z 가장 최근에 성공한 위시 콘텐츠 또는 수명주기 변경의 인스턴스입니다."}
        completedAt: {type: [string, 'null'], format: date-time, pattern: 'Z$', description: "RFC 3339 UTC Z COMPLETED 위시에 대한 명시적 완료 순간; 다른 모든 주에서는 null입니다."}
        actualDurationSeconds:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: "완료된 위시의 경우 createdAt부터 completedAt까지 경과된 전체 초입니다. 그렇지 않으면 null입니다."
        version: {$ref: '#/components/schemas/WishVersion', description: "이 스냅샷의 음수가 아닌 낙관적 동시성 버전입니다. 성공적인 상태 변경 변경는 이를 발전시키고 멱등성 재생은 원래 값을 반환합니다."}
    WishPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          description: "삭제되지 않은 소유 위시는 createdAt 내림차순, ID 내림차순입니다."
          type: array
          items: {$ref: '#/components/schemas/Wish'}
        nextCursor: {type: [string, 'null'], minLength: 1, description: "다음 위시 페이지에 대한 불투명 커서; 추가 페이지가 없으면 null입니다."}
    CreateWishRequest:
      type: object
      additionalProperties: false
      required: [purpose, targetAmount]
      properties:
        purpose: {$ref: '#/components/schemas/PurposeInput'}
        targetAmount: {$ref: '#/components/schemas/KrwPositive'}
        targetDate: {type: [string, 'null'], format: date}
    RepresentativeWishSelectionRequest:
      type: object
      additionalProperties: false
      required: [wishId]
      properties:
        wishId: {$ref: '#/components/schemas/Uuid', description: "삭제되지 않은 활성 위시의 UUID를(를) 이 카드 잔액 계정에서 선택하세요."}
    WishMergePatch:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {$ref: '#/components/schemas/WishVersion'}
        purpose: {$ref: '#/components/schemas/PurposeInput'}
        targetAmount: {$ref: '#/components/schemas/KrwPositive'}
        targetDate: {type: [string, 'null'], format: date}
        visibility: {$ref: '#/components/schemas/WishVisibility'}
      anyOf:
        - required: [purpose]
        - required: [targetAmount]
        - required: [targetDate]
        - required: [visibility]
    WishAmountCommand:
      type: object
      additionalProperties: false
      required: [amount, expectedVersion]
      properties:
        amount: {$ref: '#/components/schemas/KrwPositive'}
        expectedVersion: {$ref: '#/components/schemas/WishVersion'}
    WishVersionCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {$ref: '#/components/schemas/WishVersion'}
    WishTransferRequest:
      type: object
      additionalProperties: false
      required: [sourceWishId, destinationWishId, amount, sourceExpectedVersion, destinationExpectedVersion]
      properties:
        sourceWishId: {$ref: '#/components/schemas/Uuid'}
        destinationWishId: {$ref: '#/components/schemas/Uuid'}
        amount: {$ref: '#/components/schemas/KrwPositive'}
        sourceExpectedVersion: {$ref: '#/components/schemas/WishVersion'}
        destinationExpectedVersion: {$ref: '#/components/schemas/WishVersion'}
    WishMutationResult:
      type: object
      additionalProperties: false
      required: [wish, eventId]
      properties:
        wish: {$ref: '#/components/schemas/Wish', description: "변경 후 신뢰할 수 있는 위시 스냅샷 또는 동일한 멱등성 재생에서 반환된 원본 스냅샷."}
        eventId: {type: [string, 'null'], format: uuid, description: "변경에 의해 생성된 불변 원장 이벤트의 UUID 변경가 자금을 이동하지 않아 원장 이벤트가 생성되지 않으면 null입니다."}
    WishTransferResult:
      type: object
      additionalProperties: false
      required: [sourceWish, destinationWish, eventId, occurredAt]
      properties:
        sourceWish: {$ref: '#/components/schemas/Wish', description: "원자 전송 후 신뢰할 수 있는 소스 위시 스냅샷입니다."}
        destinationWish: {$ref: '#/components/schemas/Wish', description: "원자 전송 후 신뢰할 수 있는 대상 위시 스냅샷입니다."}
        eventId: {$ref: '#/components/schemas/Uuid', description: "두 가지 전송 효과를 모두 포함하는 단일 불변 원장 이벤트의 UUID."}
        occurredAt: {$ref: '#/components/schemas/UtcInstant', description: "RFC 3339 UTC Z 전송의 소스 및 대상 효과에 의해 공유되는 인스턴스입니다."}
    BalanceAdjustmentEventReference:
      type: object
      description: "케이스의 변경 가능한 현재 상태가 아닌 불변 원장-조정 케이스 이벤트 링크 출처입니다. 관측 전용 1차 성공 불일치 사실은 이력 항목을 생성하지 않으며, 부족량, 알림 상태 및 관련 없는 관측 데이터는 여기에 노출되지 않습니다."
      additionalProperties: false
      required: [adjustmentCaseId, eventRole, sequenceNumber]
      properties:
        adjustmentCaseId: {$ref: '#/components/schemas/Uuid', description: "이 불변 원장 이벤트에 연결된 잔액 조정 건의 UUID입니다."}
        eventRole: {type: string, enum: [OPENING_DECREASE, INTERMEDIATE, RESOLUTION], description: "조정 사례 내에서 이 이벤트의 불변 역할: 개시 감소, 중간 보상 또는 해결."}
        sequenceNumber: {type: integer, minimum: 0, description: "조정 사례 내부에서 이 이벤트 링크의 0 기반 불변 순서입니다."}
    WishHistoryReference:
      type: object
      additionalProperties: false
      required: [wishId, wishPurposeSnapshot, deletedWish, detailAvailable]
      allOf:
        - if:
            properties:
              deletedWish: {const: true}
          then:
            properties:
              detailAvailable: {const: false}
      properties:
        wishId: {$ref: '#/components/schemas/Uuid', description: "이 계정 단위 이벤트에서 참조하는 Wish의 안정적인 UUID입니다."}
        wishPurposeSnapshot: {$ref: '#/components/schemas/Purpose', description: "이벤트가 발생했을 때 원장 위시 효과에 의해 포착된 불변의 위시 목적입니다."}
        deletedWish: {type: boolean, description: "응답을 읽을 때 참조된 Wish가 삭제 표시되면 참입니다."}
        detailAvailable: {type: boolean, description: "현재 일반 위시 세부정보 탐색을 사용할 수 있는지 여부 deletedWish가 true이면 항상 false입니다. URL 또는 경로가 내보내지지 않습니다."}
    WishHistorySubject:
      type: object
      additionalProperties: false
      required: [wishId, displayPurpose, deletedWish, detailAvailable]
      allOf:
        - if:
            properties:
              deletedWish: {const: true}
          then:
            properties:
              detailAvailable: {const: false}
          else:
            properties:
              detailAvailable: {const: true}
      properties:
        wishId: {$ref: '#/components/schemas/Uuid', description: "불변 내역이 반환되는 소유 Wish의 안정적인 UUID입니다."}
        displayPurpose: {$ref: '#/components/schemas/Purpose', description: "활성 Wish의 현재 목적 또는 삭제된 Wish에 대한 삭제 표시 직전에 캡처된 목적 스냅샷입니다."}
        deletedWish: {type: boolean, description: "응답을 읽을 때 소유한 Wish가 삭제 표시되면 참입니다."}
        detailAvailable: {type: boolean, description: "deletedWish의 정확한 논리적 부정; false는 삭제된 Wish의 일반 세부정보로의 이동을 방지합니다. URL 또는 경로가 내보내지지 않습니다."}
    AccountFundMovement:
      oneOf:
        - $ref: '#/components/schemas/AccountCardBalanceChange'
        - $ref: '#/components/schemas/AccountWishDeposit'
        - $ref: '#/components/schemas/AccountWishWithdrawal'
        - $ref: '#/components/schemas/AccountWishTransfer'
        - $ref: '#/components/schemas/AccountWishCompletionReturn'
        - $ref: '#/components/schemas/AccountWishAbandonmentReturn'
        - $ref: '#/components/schemas/AccountWishDeletionReturn'
      discriminator:
        propertyName: eventType
        mapping:
          CARD_BALANCE_CHANGE: '#/components/schemas/AccountCardBalanceChange'
          WISH_DEPOSIT: '#/components/schemas/AccountWishDeposit'
          WISH_WITHDRAWAL: '#/components/schemas/AccountWishWithdrawal'
          WISH_TRANSFER: '#/components/schemas/AccountWishTransfer'
          WISH_COMPLETION_RETURN: '#/components/schemas/AccountWishCompletionReturn'
          WISH_ABANDONMENT_RETURN: '#/components/schemas/AccountWishAbandonmentReturn'
          WISH_DELETION_RETURN: '#/components/schemas/AccountWishDeletionReturn'
    AccountCardBalanceChange:
      type: object
      additionalProperties: false
      required: [eventId, eventType, observationId, lookupMethod, occurredAt, actualCardBalanceDelta, actualCardBalanceAfter, accountAvailableBalanceDelta, accountAvailableBalanceAfter, correctionOfEventId, balanceAdjustment]
      properties:
        eventId: {$ref: '#/components/schemas/Uuid', description: "이 불변의 CARD_BALANCE_CHANGE 이벤트의 UUID; 해당 CardBalanceChange eventId와 동일합니다."}
        eventType: {type: string, const: CARD_BALANCE_CHANGE, description: "항상 CARD_BALANCE_CHANGE, 0이 아닌 성공적인 외부 카드 잔액 변경을 식별합니다."}
        observationId: {$ref: '#/components/schemas/Uuid', description: "이 이벤트와 연결된 정확한 성공적인 잔액 관측의 UUID입니다."}
        lookupMethod: {$ref: '#/components/schemas/BalanceLookupMethod', description: "연결된 관측에 대한 트리거: USER_REQUESTED, PRE_DEPOSIT 또는 AUTO_DAILY."}
        occurredAt: {$ref: '#/components/schemas/UtcInstant', description: "RFC 3339 UTC Z 인스턴트는 연결된 관측의 observedAt 값과 같습니다."}
        actualCardBalanceDelta:
          description: "0이 아닌 부호 있는 정수 KRW 외부 카드 잔액 변경."
          allOf: [{$ref: '#/components/schemas/KrwSigned'}, {not: {const: 0}}]
        actualCardBalanceAfter: {$ref: '#/components/schemas/KrwNonNegative', description: "이 외부 변경 후에 관측된 음수가 아닌 정수 KRW입니다."}
        accountAvailableBalanceDelta: {$ref: '#/components/schemas/KrwSigned', description: "서명된 원장에서 사용 가능한 계정 잔액 변경은 actualCardBalanceDelta와 정확히 동일합니다."}
        accountAvailableBalanceAfter: {$ref: '#/components/schemas/KrwSigned', description: "이벤트 직후 서명된 원장 사용 가능 계정 잔액 음수 값은 유지되며 표시가 고정되지 않습니다."}
        correctionOfEventId: {type: [string, 'null'], format: uuid, description: "이 새로운 이벤트로 보상된 이전의 불변 동일 계정 이벤트 또는 null입니다. 이전 이벤트는 변경되지 않습니다."}
        balanceAdjustment:
          description: "불변 잔액 조정 건 이벤트 링크 출처 또는 이 이벤트에 조정 사례 링크가 없는 경우 null입니다."
          oneOf: [{$ref: '#/components/schemas/BalanceAdjustmentEventReference'}, {type: 'null'}]
    AccountWishDeposit:
      type: object
      additionalProperties: false
      required: [eventId, eventType, wish, occurredAt, accountAvailableBalanceDelta, accountAvailableBalanceAfter, correctionOfEventId, balanceAdjustment]
      properties:
        eventId: {$ref: '#/components/schemas/Uuid', description: "불변 원장 이벤트의 UUID는 해당 위시 예치금 예상과 공유됩니다."}
        eventType: {type: string, const: WISH_DEPOSIT, description: "항상 WISH_DEPOSIT, 계정 가용성에서 하나의 Wish에 할당된 자금을 식별합니다."}
        wish: {$ref: '#/components/schemas/WishHistoryReference', description: "자금을 받은 Wish에 대한 이벤트 시간 목적 및 조회 시점 묘비 컨텍스트입니다."}
        occurredAt: {$ref: '#/components/schemas/UtcInstant', description: "RFC 3339 UTC Z 이 불변 입금 이벤트가 발생한 순간입니다."}
        accountAvailableBalanceDelta:
          description: "이번 입금으로 인해 음수 KRW 원장 사용 가능 계정 잔액이 변경되었습니다."
          allOf: [{$ref: '#/components/schemas/KrwSigned'}, {maximum: -1}]
        accountAvailableBalanceAfter: {$ref: '#/components/schemas/KrwSigned', description: "입금 후 즉시 서명된 원장에서 사용 가능한 계좌 잔액입니다."}
        correctionOfEventId: {type: [string, 'null'], format: uuid, description: "이 새로운 이벤트로 보상된 이전의 불변 동일 계정 이벤트 또는 null입니다."}
        balanceAdjustment:
          description: "불변 잔액 조정 건 이벤트 링크 출처 또는 이 이벤트에 조정 사례 링크가 없는 경우 null입니다."
          oneOf: [{$ref: '#/components/schemas/BalanceAdjustmentEventReference'}, {type: 'null'}]
    AccountWishWithdrawal:
      type: object
      additionalProperties: false
      required: [eventId, eventType, wish, occurredAt, accountAvailableBalanceDelta, accountAvailableBalanceAfter, correctionOfEventId, balanceAdjustment]
      properties:
        eventId: {$ref: '#/components/schemas/Uuid', description: "해당 위시 출금 예상과 공유되는 불변 원장 이벤트의 UUID."}
        eventType: {type: string, const: WISH_WITHDRAWAL, description: "항상 WISH_WITHDRAWAL, 하나의 Wish에서 계정 가용성으로 반환된 자금을 식별합니다."}
        wish: {$ref: '#/components/schemas/WishHistoryReference', description: "자금이 인출된 Wish에 대한 이벤트 시간 목적 및 조회 시점 묘비 컨텍스트입니다."}
        occurredAt: {$ref: '#/components/schemas/UtcInstant', description: "RFC 3339 UTC Z 이 불변의 출금 이벤트가 발생한 순간입니다."}
        accountAvailableBalanceDelta:
          description: "이번 출금으로 인해 양수 KRW 원장 사용 가능 계정 잔액이 변경되었습니다."
          allOf: [{$ref: '#/components/schemas/KrwSigned'}, {minimum: 1}]
        accountAvailableBalanceAfter: {$ref: '#/components/schemas/KrwSigned', description: "출금 후 즉시 서명된 원장에서 사용 가능한 계좌 잔액입니다."}
        correctionOfEventId: {type: [string, 'null'], format: uuid, description: "이 새로운 이벤트로 보상된 이전의 불변 동일 계정 이벤트 또는 null입니다."}
        balanceAdjustment:
          description: "불변 잔액 조정 건 이벤트 링크 출처 또는 이 이벤트에 조정 사례 링크가 없는 경우 null입니다."
          oneOf: [{$ref: '#/components/schemas/BalanceAdjustmentEventReference'}, {type: 'null'}]
    AccountWishTransfer:
      type: object
      additionalProperties: false
      required: [eventId, eventType, sourceWish, destinationWish, amount, occurredAt, accountAvailableBalanceDelta, accountAvailableBalanceAfter, correctionOfEventId, balanceAdjustment]
      properties:
        eventId: {$ref: '#/components/schemas/Uuid', description: "UUID 반대 서명된 두 위시 전송 예상에서 공유하는 불변 하나의 원장 이벤트입니다."}
        eventType: {type: string, const: WISH_TRANSFER, description: "항상 WISH_TRANSFER, 동일한 계정에 있는 두 개의 서로 다른 위시 사이의 원자적 전송을 식별합니다."}
        sourceWish: {$ref: '#/components/schemas/WishHistoryReference', description: "고유한 소스 Wish에 대한 이벤트 시간 목적 및 조회 시점 묘비 컨텍스트입니다."}
        destinationWish: {$ref: '#/components/schemas/WishHistoryReference', description: "고유한 대상 Wish에 대한 이벤트 시간 목적 및 조회 시점 묘비 컨텍스트입니다."}
        amount: {$ref: '#/components/schemas/KrwPositive', description: "양의 정수 KRW가 sourceWish에서 destinationWish로 원자적으로 이동되었습니다."}
        occurredAt: {$ref: '#/components/schemas/UtcInstant', description: "RFC 3339 UTC Z 전송의 불변 위시 효과에 의해 즉시 공유됩니다."}
        accountAvailableBalanceDelta: {type: integer, const: 0, description: "동일한 계정의 위시 이체는 계정 단위의 가용성을 변경하지 않으므로 항상 0입니다."}
        accountAvailableBalanceAfter: {$ref: '#/components/schemas/KrwSigned', description: "이체 후 서명된 원장에서 사용 가능한 계정 잔액은 이체 자체에 의해 변경되지 않습니다."}
        correctionOfEventId: {type: [string, 'null'], format: uuid, description: "이 새로운 이벤트로 보상된 이전의 불변 동일 계정 이벤트 또는 null입니다."}
        balanceAdjustment:
          description: "불변 잔액 조정 건 이벤트 링크 출처 또는 이 이벤트에 조정 사례 링크가 없는 경우 null입니다."
          oneOf: [{$ref: '#/components/schemas/BalanceAdjustmentEventReference'}, {type: 'null'}]
    AccountWishCompletionReturn:
      type: object
      additionalProperties: false
      required: [eventId, eventType, wish, occurredAt, accountAvailableBalanceDelta, accountAvailableBalanceAfter, correctionOfEventId, balanceAdjustment]
      properties:
        eventId: {$ref: '#/components/schemas/Uuid', description: "완료된 Wish의 움직임 투영과 공유되는 불변 원장 이벤트의 UUID."}
        eventType: {type: string, const: WISH_COMPLETION_RETURN, description: "항상 WISH_COMPLETION_RETURN, 명시적 완료 중에 반환된 0이 아닌 자금을 식별합니다."}
        wish: {$ref: '#/components/schemas/WishHistoryReference', description: "완료된 Wish에 대한 이벤트 시간 목적 및 조회 시점 묘비 컨텍스트입니다."}
