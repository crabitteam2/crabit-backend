      operationId: depositToWish
      summary: "카드 잔액 계정 자금을 위시에 적립"
      description: "내부적으로 PRE_DEPOSIT 조회를 수행합니다. 공급자 실패로 인해 Wish는 변경되지 않습니다. 지속적인 불일치 관측은 이 예금만을 잠그고 거부합니다."
      security: [{SyntheticBearer: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
