        '404': {$ref: '#/components/responses/WishOrAccountNotFound'}
        '409': {$ref: '#/components/responses/TransferConflict'}
        '422': {$ref: '#/components/responses/InvalidTransferAmountOrVersion'}
  /v1/card-balance-accounts/{cardBalanceAccountId}/wishes/{wishId}/completion:
    parameters:
      - $ref: '#/components/parameters/CardBalanceAccountId'
      - $ref: '#/components/parameters/WishId'
    post:
      tags: [Wishes]
      operationId: completeWish
      summary: "목표 금액에 도달한 위시 완료"
      description: "OPEN 잔액 조정 건은 완료를 차단하지 않습니다. 반환된 Wish에는 커밋된 변경 후 조정 플래그가 포함되어 있습니다."
      security: [{SyntheticBearer: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
