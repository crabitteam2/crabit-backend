              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422': {$ref: '#/components/responses/InvalidVersion'}
  /v1/card-balance-accounts/{cardBalanceAccountId}/wishes/{wishId}/fund-movements:
    parameters:
      - $ref: '#/components/parameters/CardBalanceAccountId'
      - $ref: '#/components/parameters/WishId'
    get:
      tags: [Wishes]
      operationId: listWishFundMovements
      summary: "위시 단위 불변 자금 이동 이력 조회"
      description: "요청한 소유 Wish에 대해서만 불변 원장 위시 효과를 반환합니다. 외부 카드 변경 사항은 나타나지 않습니다. 일반 위시 세부 정보가 404를 반환하더라도 소유한 삭제 표시 Wish는 여기서 읽을 수 있습니다. 결과는 occurredAt DESC, eventId DESC 순으로 정렬됩니다. 불투명 커서는 이 작업, 계정, 위시, 정렬 버전 및 최종 튜플에 바인딩됩니다. 형식이 잘못되었거나 일치하지 않는 커서는 부분 페이지 없이 400을 반환합니다. 연속은 엄격하게 해당 튜플 아래에 있으므로 eventId는 동일한 타임스탬프를 안정화하고 경계 이전의 이후 이벤트 정렬은 연속을 변경하지 않습니다. 유효한 커서와 함께 유효한 limit 값를 사용할 수 있습니다. Authorization 및 소유권은 요청이 있을 때마다 재평가되며 캐시 가능성 보장은 도입되지 않습니다."
      security: [{SyntheticBearer: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: "기금 이동 내역을 기원합니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WishFundMovementPage'}
              examples:
                transfer-source: {$ref: '#/components/examples/WishTransferSourcePageExample'}
                deleted-wish: {$ref: '#/components/examples/DeletedWishHistoryPageExample'}
                deleted-wish-empty: {$ref: '#/components/examples/EmptyDeletedWishHistoryPageExample'}
        '400': {$ref: '#/components/responses/MalformedRequest'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/WishHistoryOrAccountNotFound'}
  /v1/academies/{academyId}/shared-cards:
    parameters: [{$ref: '#/components/parameters/AcademyId'}]
    get:
      tags: [Shared Cards]
      operationId: listAcademySharedCards
      summary: "학원에서 현재 볼 수 있는 공유 카드 목록 조회"
      description: "읽을 때마다 멤버십, 우정, 양자 차단을 재평가합니다. 소유자를 제외합니다. PRIVATE 위시가 카드를 생성하지 않습니다. 임시 주문: contentUpdatedAt DESC, sharedCardId DESC. 현재 정렬 매개변수는 지원되지 않습니다. 이 임시 정책에 따라 콘텐츠 또는 출판물만 변경되고 재주문 카드가 적용됩니다. 친구 우선순위 및 임베딩 기반 추천 주문은 향후 계약에 대해 계속 열려 있으며 이 버전에서는 활성화되지 않습니다."
      security: [{SyntheticBearer: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: "현재 진행 상황 및 완료 카드가 표시됩니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SharedCardPage'}
              examples:
                progress-adjustment-false-page: {$ref: '#/components/examples/SharedProgressAdjustmentFalsePage'}
                progress-adjustment-true-page: {$ref: '#/components/examples/SharedProgressAdjustmentTruePage'}
                completion-page: {$ref: '#/components/examples/SharedCompletionPage'}
        '400': {$ref: '#/components/responses/MalformedRequest'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AcademyNotFound'}
  /v1/academies/{academyId}/shared-cards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/AcademyId'
      - $ref: '#/components/parameters/SharedCardId'
    get:
      tags: [Shared Cards]
      operationId: getAcademySharedCard
      summary: "현재 볼 수 있는 공유 카드 조회"
      description: "소유자는 자신의 현재 공개 카드를 읽을 수 있습니다. 다른 모든 부재 또는 가시성 오류는 숨겨집니다."
      security: [{SyntheticBearer: []}]
      responses:
        '200':
          description: "현재 표시되는 공유 카드 1개."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SharedCard'}
              examples:
                progress-adjustment-false: {$ref: '#/components/examples/SharedProgressAdjustmentFalse'}
                progress-adjustment-true: {$ref: '#/components/examples/SharedProgressAdjustmentTrue'}
                completion: {$ref: '#/components/examples/SharedCompletion'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/SharedCardOrAcademyNotFound'}
  /v1/academies/{academyId}/students:
    parameters: [{$ref: '#/components/parameters/AcademyId'}]
    get:
      tags: [Friend Management]
      operationId: searchAcademyStudents
      summary: "닉네임으로 현재 같은 학원 학생 검색"
      description: "저장된 NFC 정규화된 별명의 대소문자를 구분하는 연속 유니코드 코드 포인트 하위 문자열로 인증된 학생 학원의 현재 구성원을 검색합니다. 인증된 학생, 비회원, 양방향 활성 블록이 있는 후보자는 제외됩니다. 각 결과는 NONE, FRIEND, OUTGOING_PENDING 또는 INCOMING_PENDING 중 정확히 하나의 현재 관계 상태를 계산합니다. 결과는 닉네임 ASC, studentId ASC 순으로 정렬됩니다. 불투명 커서는 이 작업, 인증된 학생, 학원, 정렬 버전, 정규화된 닉네임 필터 및 최종 주문 튜플에 바인딩됩니다. 잘못된 형식, 외부 작업, 외부 행위자, 외부 학원 또는 필터 불일치 커서는 부분 페이지 없이 400을 반환합니다. 연속은 엄격하게 마지막 튜플 이후에 이루어지며 유효한 커서와 함께 유효한 제한을 사용할 수 있습니다."
      security: [{SyntheticBearer: []}]
      parameters:
        - $ref: '#/components/parameters/NicknameSearch'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: "현재 동학원생과 관계상태가 일치합니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudentRelationshipPage'}
              examples:
                relationship-states: {$ref: '#/components/examples/StudentRelationshipSearchPage'}
                empty-page: {$ref: '#/components/examples/EmptyStudentRelationshipPage'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/FriendManagementAcademyNotFound'}
  /v1/academies/{academyId}/friends:
    parameters: [{$ref: '#/components/parameters/AcademyId'}]
    get:
      tags: [Friend Management]
      operationId: listAcademyFriends
      summary: "현재 같은 학원 친구 목록 조회"
      description: "상대방이 요청한 학원의 현재 회원인 인증된 학생의 현재 정식 친구 관계를 나열합니다. 결과는 friendsSince DESC, studentId DESC 순으로 정렬됩니다. 불투명 커서는 이 작업, 인증된 학생, 학원, 정렬 버전 및 최종 튜플에 바인딩됩니다. 형식이 잘못되었거나 일치하지 않는 커서는 부분 페이지 없이 400을 반환합니다. 연속은 엄격하게 최종 튜플 아래에 있으며 유효한 커서와 함께 유효한 제한을 사용할 수 있습니다."
      security: [{SyntheticBearer: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: "현재 학원 친구."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendPage'}
              examples:
                current-friends: {$ref: '#/components/examples/FriendPageExample'}
                empty-page: {$ref: '#/components/examples/EmptyFriendPage'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/FriendManagementAcademyNotFound'}
  /v1/academies/{academyId}/friends/{studentId}:
    parameters:
      - $ref: '#/components/parameters/AcademyId'
      - $ref: '#/components/parameters/StudentId'
    delete:
      tags: [Friend Management]
      operationId: unfriendAcademyStudent
      summary: "현재 같은 학원 친구 관계 종료"
      description: "인증된 학생과 요청한 학원의 대상과의 현재 우정을 종료합니다. 부재, 종료된 관계, 비회원, 비소유권은 FRIENDSHIP_NOT_FOUND로 숨겨집니다. 이 작업은 기록된 친구 요청을 다시 활성화하지 않으며 성공 본문도 없습니다."
      security: [{SyntheticBearer: []}]
      responses:
        '204':
          description: "우정이 끝났습니다. 응답에는 본문이 없습니다."
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/FriendshipOrAcademyNotFound'}
  /v1/academies/{academyId}/friend-requests:
    parameters: [{$ref: '#/components/parameters/AcademyId'}]
    post:
      tags: [Friend Management]
      operationId: sendFriendRequest
      summary: "친구 요청 보내기"
      description: "CurrentPrincipal.subjectId에서 대상 현재 동일 학원 학생에게 하나의 PENDING 요청을 생성합니다. 클라이언트 입력은 발신자를 제어하지 않습니다. 표준 학생 쌍 잠금 아래에서 활성 양측 블록은 STUDENT_NOT_FOUND로 숨겨집니다. 자신, 현재 우정, 동일한 방향 PENDING 및 역방향 PENDING 상태는 문서화된 충돌을 반환합니다. Idempotency-Key는 허용되지 않습니다. 재생은 현재 상태에 대해 평가됩니다."
      security: [{SyntheticBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFriendRequestRequest'}
      responses:
        '201':
          description: "PENDING 상태에서 친구 요청이 생성되었습니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendRequest'}
              examples:
                created: {$ref: '#/components/examples/FriendRequestCreated'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/StudentOrAcademyNotFound'}
        '409': {$ref: '#/components/responses/FriendRequestCreateConflict'}
  /v1/academies/{academyId}/friend-requests/sent:
    parameters: [{$ref: '#/components/parameters/AcademyId'}]
    get:
      tags: [Friend Management]
      operationId: listSentFriendRequests
      summary: "보낸 대기 중 친구 요청 목록 조회"
      description: "보낸 사람이 인증된 학생인 현재 PENDING 요청만 나열합니다. 결과는 createdAt DESC, friendRequestId DESC 순으로 정렬됩니다. 불투명 커서는 이 작업, 인증된 학생, 학원, 정렬 버전 및 최종 튜플에 바인딩됩니다. 형식이 잘못되었거나 일치하지 않는 커서는 부분 페이지 없이 400을 반환합니다. 연속은 엄격하게 최종 튜플 아래에 있으며 유효한 커서와 함께 유효한 제한을 사용할 수 있습니다."
      security: [{SyntheticBearer: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: "행위자 소유 발신 PENDING 요청."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendRequestPage'}
              examples:
                sent: {$ref: '#/components/examples/SentFriendRequestPage'}
                empty-page: {$ref: '#/components/examples/EmptyFriendRequestPage'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/FriendManagementAcademyNotFound'}
  /v1/academies/{academyId}/friend-requests/received:
    parameters: [{$ref: '#/components/parameters/AcademyId'}]
    get:
      tags: [Friend Management]
      operationId: listReceivedFriendRequests
      summary: "받은 대기 중 친구 요청 목록 조회"
      description: "수신자가 인증된 학생인 현재 PENDING 요청만 나열합니다. 결과는 createdAt DESC, friendRequestId DESC 순으로 정렬됩니다. 불투명 커서는 이 작업, 인증된 학생, 학원, 정렬 버전 및 최종 튜플에 바인딩됩니다. 형식이 잘못되었거나 일치하지 않는 커서는 부분 페이지 없이 400을 반환합니다. 연속은 엄격하게 최종 튜플 아래에 있으며 유효한 커서와 함께 유효한 제한을 사용할 수 있습니다."
      security: [{SyntheticBearer: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: "행위자 소유의 수신 PENDING 요청입니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendRequestPage'}
              examples:
                received: {$ref: '#/components/examples/ReceivedFriendRequestPage'}
                empty-page: {$ref: '#/components/examples/EmptyFriendRequestPage'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/FriendManagementAcademyNotFound'}
  /v1/academies/{academyId}/friend-requests/{friendRequestId}:
    parameters:
      - $ref: '#/components/parameters/AcademyId'
      - $ref: '#/components/parameters/FriendRequestId'
    delete:
      tags: [Friend Management]
      operationId: cancelFriendRequest
      summary: "보낸 대기 중 친구 요청 취소"
      description: "보낸 사람으로서 인증된 학생이 소유한 PENDING 요청만 취소합니다. 보낸 사람이 소유하지 않거나 승인되지 않은 학원 외부 요청은 FRIEND_REQUEST_NOT_FOUND로 숨겨집니다. 처리된 소유 요청은 FRIEND_REQUEST_NOT_PENDING를 반환합니다."
      security: [{SyntheticBearer: []}]
      responses:
        '200':
          description: "상태 CANCELED 및 null가 아닌 processedAt로 인해 요청이 취소되었습니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendRequest'}
              examples:
                canceled: {$ref: '#/components/examples/FriendRequestCanceled'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/FriendRequestOrAcademyNotFound'}
        '409': {$ref: '#/components/responses/FriendRequestNotPending'}
  /v1/academies/{academyId}/friend-requests/{friendRequestId}/acceptance:
    parameters:
      - $ref: '#/components/parameters/AcademyId'
      - $ref: '#/components/parameters/FriendRequestId'
    post:
      tags: [Friend Management]
      operationId: acceptFriendRequest
      summary: "받은 대기 중 친구 요청 수락"
      description: "인증된 학생이 소유한 PENDING 요청만 수신자로 수락합니다. 표준 학생 쌍 잠금에 따라 서비스는 현재 학원 멤버십, 정확한 요청, 현재 우정의 부재 및 방향 차단의 부재를 다시 확인합니다. 요청은 ACCEPTED가 되며 한 트랜잭션에서 정확히 하나의 현재 우정이 생성되거나 다시 시작됩니다. 동시 패자는 문서화된 충돌을 반환합니다."
      security: [{SyntheticBearer: []}]
      responses:
        '200':
          description: "요청이 수락되었으며 현재 하나의 우정이 형성되었습니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Friend'}
              examples:
                accepted: {$ref: '#/components/examples/FriendAccepted'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/FriendRequestOrAcademyNotFound'}
        '409': {$ref: '#/components/responses/FriendRequestAcceptanceConflict'}
  /v1/academies/{academyId}/friend-requests/{friendRequestId}/rejection:
    parameters:
      - $ref: '#/components/parameters/AcademyId'
      - $ref: '#/components/parameters/FriendRequestId'
    post:
      tags: [Friend Management]
      operationId: rejectFriendRequest
      summary: "받은 대기 중 친구 요청 거절"
      description: "인증된 학생이 수신자로 소유한 PENDING 요청만 거부합니다. 수신자 소유가 아닌 학원 외부 요청 또는 승인되지 않은 요청은 FRIEND_REQUEST_NOT_FOUND로 숨겨집니다. 처리된 소유 요청은 FRIEND_REQUEST_NOT_PENDING를 반환합니다."
      security: [{SyntheticBearer: []}]
      responses:
        '200':
          description: "상태 REJECTED 및 null가 아닌 processedAt로 인해 요청이 거부되었습니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendRequest'}
              examples:
                rejected: {$ref: '#/components/examples/FriendRequestRejected'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/FriendRequestOrAcademyNotFound'}
        '409': {$ref: '#/components/responses/FriendRequestNotPending'}
  /v1/me/student-blocks:
    get:
      tags: [Friend Management]
      operationId: listMyStudentBlocks
      summary: "인증된 학생이 설정한 활성 차단 목록 조회"
      description: "차단기가 CurrentPrincipal.subjectId인 활성 방향 블록만 나열합니다. 결과는 blockedAt DESC, studentId DESC 순으로 정렬됩니다. 불투명 커서는 이 작업, 인증된 학생, 정렬 버전 및 최종 튜플에 바인딩됩니다. 형식이 잘못되었거나 일치하지 않는 커서는 부분 페이지 없이 400을 반환합니다. 연속은 엄격하게 최종 튜플 아래에 있으며 유효한 커서와 함께 유효한 제한을 사용할 수 있습니다."
      security: [{SyntheticBearer: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: "인증된 학생이 생성한 활성 블록입니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudentBlockPage'}
              examples:
                active-blocks: {$ref: '#/components/examples/StudentBlockPageExample'}
                empty-page: {$ref: '#/components/examples/EmptyStudentBlockPage'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
    post:
      tags: [Friend Management]
      operationId: blockStudent
      summary: "학생을 전체 범위에서 차단"
      description: "인증된 학생의 방향성 전역 블록을 생성하거나 다시 생성합니다. 클라이언트 입력은 차단기를 제어하지 않습니다. 정식 학생 쌍 잠금에 따라 작업은 모든 학원에서 현재의 모든 우정을 종료하고 양방향 및 모든 학원의 모든 PENDING 요청을 processedAt가 설정된 CANCELED로 변경하고 한 번의 트랜잭션으로 블록을 활성화합니다. 재생은 현재 상태를 기준으로 평가되며 Idempotency-Key는 허용되지 않습니다."
      security: [{SyntheticBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateStudentBlockRequest'}
      responses:
        '201':
          description: "방향성 전역 블록이 생성되거나 재생성됩니다."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudentBlock'}
              examples:
                created: {$ref: '#/components/examples/StudentBlockCreated'}
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/StudentNotFound'}
        '409': {$ref: '#/components/responses/StudentBlockConflict'}
  /v1/me/student-blocks/{studentId}:
    parameters: [{$ref: '#/components/parameters/StudentId'}]
    delete:
      tags: [Friend Management]
      operationId: unblockStudent
      summary: "단방향 학생 차단 해제"
      description: "인증된 학생이 차단된 현재 블록만 해제합니다. 부재, 해제된 블록 또는 행위자가 소유하지 않은 블록은 STUDENT_BLOCK_NOT_FOUND으로 숨겨집니다. 차단을 해제해도 우정이나 차단으로 인해 취소된 요청은 절대 복원되지 않으며 성공 본문도 없습니다."
      security: [{SyntheticBearer: []}]
      responses:
        '204':
          description: "블록이 해제되었습니다. 응답에는 본문이 없습니다."
        '400': {$ref: '#/components/responses/FriendManagementMalformedRequest'}
        '401': {$ref: '#/components/responses/FriendManagementAuthRequired'}
        '403': {$ref: '#/components/responses/FriendManagementForbidden'}
        '404': {$ref: '#/components/responses/StudentBlockNotFound'}
components:
  securitySchemes:
    SyntheticBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-synthetic-token
      description: "불투명한 합성 주 토큰. 알려진 토큰은 학생 또는 인증된 비학생 교직원 교장을 식별합니다. 토큰 발행, 새로 고침, 페르소나 선택 및 고정 장치 제어는 본 계약 외부에 있습니다."
  parameters:
    CardBalanceAccountId:
      name: cardBalanceAccountId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    WishId:
      name: wishId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    AcademyId:
      name: academyId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    SharedCardId:
      name: cardId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    StudentId:
      name: studentId
      in: path
      required: true
      description: "UUID 관계 상대방의; 인증된 소유권은 항상 CurrentPrincipal에서 나오며 여기에는 제공되지 않습니다."
      schema: {$ref: '#/components/schemas/Uuid'}
    FriendRequestId:
      name: friendRequestId
      in: path
      required: true
      description: "친구 요청의 UUID입니다. 승인되지 않았거나 잘못된 역할 식별자는 FRIEND_REQUEST_NOT_FOUND로 정규화됩니다."
      schema: {$ref: '#/components/schemas/Uuid'}
    NicknameSearch:
      name: nickname
      in: query
      required: true
      description: "선행 및 후행 유니코드 Space_Separator 코드 포인트를 반복적으로 제거하고, NFC로 정규화하고, Cc, Cf, Zl 및 Zp를 거부하고, 1~80개의 유니코드 코드 포인트가 필요합니다. 일치는 NFC 정규화된 저장된 별명에 대해 대소문자를 구분하는 연속 유니코드 코드 포인트 하위 문자열입니다."
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: "끝점의 고정 순서에 연결된 불투명 커서입니다."
      schema: {$ref: '#/components/schemas/Cursor'}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "학생별 영구 네임스페이스; 재사용은 동일한 작업, 대상 및 정식 요청에 대해서만 유효합니다."
      schema: {type: string, minLength: 1, maxLength: 200}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: "본문 없는 DELETE 동시성을 위한 정확한 음수가 아닌 정수 위시 버전입니다. 누락되거나 정수가 아닌 값은 400으로 유지됩니다. 디코딩된 음수 값은 422 INVALID_VERSION를 반환합니다. 음수가 아닌 오래된 값은 409 VERSION_CONFLICT를 반환합니다."
      schema: {$ref: '#/components/schemas/WishVersion'}
  headers:
    IdempotencyReplayed:
      description: "동일한 요청에 대해 원래 상태와 본문이 재생되는 경우에만 True입니다."
      schema: {type: boolean}
  responses:
    WishMutationSuccess:
      description: "위시 변경가 완료되었습니다. 동일한 재생은 원래 상태와 본문을 반환합니다."
      headers:
        Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/WishMutationResult'}
    MalformedRequest:
      description: "MALFORMED_REQUEST — 잘못된 형식의 JSON, 경로, 쿼리, 커서 또는 필수 동시성 구조(누락되거나 정수가 아닌 필수 버전 포함)."
      x-error-codes: [MALFORMED_REQUEST]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    MalformedOrIdempotencyRequired:
      description: "누락되거나 정수가 아닌 필수 버전을 포함하는 MALFORMED_REQUEST 또는 IDEMPOTENCY_KEY_REQUIRED."
      x-error-codes: [MALFORMED_REQUEST, IDEMPOTENCY_KEY_REQUIRED]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    DeletePreconditionRequired:
      description: "MALFORMED_REQUEST, EXPECTED_VERSION_REQUIRED 또는 IDEMPOTENCY_KEY_REQUIRED."
      x-error-codes: [MALFORMED_REQUEST, EXPECTED_VERSION_REQUIRED, IDEMPOTENCY_KEY_REQUIRED]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    AuthRequired:
      description: "AUTH_REQUIRED — 전달자 토큰이 없거나 유효하지 않습니다."
      x-error-codes: [AUTH_REQUIRED]
      headers:
        WWW-Authenticate:
          required: true
          schema: {type: string, const: Bearer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Forbidden:
      description: "FORBIDDEN — 인증된 주체는 학생이 아닙니다."
      x-error-codes: [FORBIDDEN]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    CardBalanceAccountNotFound:
      description: "CARD_BALANCE_ACCOUNT_NOT_FOUND — 부재, 폐쇄, 비소유 또는 교차 학원 계정이 숨겨져 있습니다."
      x-error-codes: [CARD_BALANCE_ACCOUNT_NOT_FOUND]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    WishOrAccountNotFound:
      description: "CARD_BALANCE_ACCOUNT_NOT_FOUND 또는 WISH_NOT_FOUND — 부재, 비소유권, 삭제 또는 숨겨진 상태."
      x-error-codes: [CARD_BALANCE_ACCOUNT_NOT_FOUND, WISH_NOT_FOUND]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    WishHistoryOrAccountNotFound:
      description: "CARD_BALANCE_ACCOUNT_NOT_FOUND 또는 WISH_NOT_FOUND — 계정이 없거나 소유하지 않은 경우, Wish가 없거나 외국이거나 해당 계정 외부에 있는 경우입니다. 소유한 삭제 표시 Wish는 이 기록별 응답으로 의도적으로 숨겨지지 않고 200을 반환합니다."
      x-error-codes: [CARD_BALANCE_ACCOUNT_NOT_FOUND, WISH_NOT_FOUND]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    AcademyNotFound:
      description: "ACADEMY_NOT_FOUND — 존재하지 않거나 현재 보이지 않는 학원가 숨겨져 있습니다."
      x-error-codes: [ACADEMY_NOT_FOUND]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    SharedCardOrAcademyNotFound:
      description: "ACADEMY_NOT_FOUND 또는 SHARED_CARD_NOT_FOUND — 부재 또는 현재 가시성 오류가 숨겨집니다."
      x-error-codes: [ACADEMY_NOT_FOUND, SHARED_CARD_NOT_FOUND]
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    CreateConflict:
