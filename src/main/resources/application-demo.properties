spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.datasource.url=${CRABIT_DATABASE_URL}
spring.datasource.username=${CRABIT_DATABASE_USERNAME}
spring.datasource.password=${CRABIT_DATABASE_PASSWORD}
server.forward-headers-strategy=framework
crabit.e2e.seed.enabled=false
crabit.documentation.enabled=true
crabit.demo.token.owner=${CRABIT_DEMO_TOKEN_OWNER:}
crabit.demo.token.friend=${CRABIT_DEMO_TOKEN_FRIEND:}
crabit.demo.token.nonfriend=${CRABIT_DEMO_TOKEN_NONFRIEND:}
crabit.demo.token.blocked=${CRABIT_DEMO_TOKEN_BLOCKED:}
crabit.demo.token.other-academy=${CRABIT_DEMO_TOKEN_OTHER_ACADEMY:}
crabit.demo.token.staff=${CRABIT_DEMO_TOKEN_STAFF:}
crabit.demo.balance-provider.url=${CRABIT_DEMO_BALANCE_PROVIDER_URL:}
crabit.demo.balance-provider.token=${CRABIT_DEMO_BALANCE_PROVIDER_TOKEN:}
crabit.demo.lifecycle=${CRABIT_DEMO_LIFECYCLE:serve}
crabit.recap.generation.enabled=${CRABIT_RECAP_GENERATION_ENABLED:false}
crabit.recap.generation.url=${CRABIT_RECAP_GENERATION_URL:}
crabit.recap.generation.credential=${CRABIT_RECAP_GENERATION_CREDENTIAL:}
crabit.recap.generation.poll-delay-ms=${CRABIT_RECAP_GENERATION_POLL_DELAY_MS:30000}
crabit.wish-photo.enabled=${CRABIT_WISH_PHOTO_ENABLED:false}
management.endpoint.health.access=read-only
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=false
management.endpoint.health.show-components=never
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.status.http-mapping.up=200
management.endpoint.health.status.http-mapping.down=503
management.endpoint.health.status.http-mapping.out-of-service=503
management.endpoint.health.status.http-mapping.unknown=503
management.endpoints.web.exposure.include=health
