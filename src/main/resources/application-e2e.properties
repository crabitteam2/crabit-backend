spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.datasource.url=${CRABIT_DATABASE_URL}
spring.datasource.username=${CRABIT_DATABASE_USERNAME}
spring.datasource.password=${CRABIT_DATABASE_PASSWORD}
server.forward-headers-strategy=framework
crabit.e2e.seed.enabled=true
crabit.e2e.seed.reset-on-startup=false
crabit.e2e.clock.instant=2026-08-16T00:00:00Z
crabit.recap.generation.enabled=${CRABIT_RECAP_GENERATION_ENABLED:false}
crabit.recap.generation.url=${CRABIT_RECAP_GENERATION_URL:}
crabit.recap.generation.credential=${CRABIT_RECAP_GENERATION_CREDENTIAL:}
crabit.recap.generation.poll-delay-ms=${CRABIT_RECAP_GENERATION_POLL_DELAY_MS:30000}
crabit.wish-photo.enabled=${CRABIT_WISH_PHOTO_ENABLED:false}
management.endpoint.health.access=read-only
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=false
management.endpoint.health.show-components=never
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.status.http-mapping.up=200
management.endpoint.health.status.http-mapping.down=503
management.endpoint.health.status.http-mapping.out-of-service=503
management.endpoint.health.status.http-mapping.unknown=503
management.endpoints.web.exposure.include=health
