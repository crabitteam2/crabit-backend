spring.datasource.url=${CRABIT_DATABASE_URL}
spring.datasource.username=${CRABIT_DATABASE_USERNAME}
spring.datasource.password=${CRABIT_DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
crabit.e2e.seed.enabled=false
crabit.documentation.enabled=false
crabit.wish-photo.enabled=${CRABIT_WISH_PHOTO_ENABLED:false}
crabit.feed.ranking.enabled=${CRABIT_FEED_RANKING_ENABLED:false}
crabit.feed.ranking.url=${CRABIT_FEED_RANKING_URL:}
crabit.feed.ranking.credential=${CRABIT_FEED_RANKING_CREDENTIAL:}
crabit.feed.ranking.classifier-version=${CRABIT_FEED_CLASSIFIER_VERSION:}
