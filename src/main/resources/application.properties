spring.application.name=crabit-backend
crabit.documentation.enabled=true
springdoc.api-docs.enabled=${crabit.documentation.enabled}
springdoc.swagger-ui.enabled=${crabit.documentation.enabled}
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
spring.flyway.enabled=false
management.endpoints.access.default=none
management.endpoints.web.exposure.include=
management.endpoints.jmx.exposure.exclude=*
springdoc.show-actuator=false
crabit.balance.daily.cron=0 0 0 * * *
crabit.balance.daily.zone=Asia/Seoul
