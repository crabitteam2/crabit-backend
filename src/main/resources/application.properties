spring.application.name=crabit-backend
crabit.documentation.enabled=true
springdoc.api-docs.enabled=${crabit.documentation.enabled}
springdoc.swagger-ui.enabled=${crabit.documentation.enabled}
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
spring.flyway.enabled=false
management.endpoints.access.default=none
management.endpoints.web.exposure.include=
management.endpoints.jmx.exposure.exclude=*
springdoc.show-actuator=false
crabit.balance.daily.cron=0 0 0 * * *
crabit.balance.daily.zone=Asia/Seoul
crabit.recommendation.handoff.enabled=false
crabit.recommendation.handoff.receiver-url=
crabit.recommendation.handoff.trigger-credential=
crabit.recommendation.handoff.receiver-credential=
crabit.wish-photo.enabled=false
crabit.wish-photo.cleanup-delay-ms=30000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
